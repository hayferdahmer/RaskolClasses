# ============================================================
#  RaskolClasses v1.14.0 — Специализации классов
#  Выбор на 40 уровне, один раз, бесплатно. Респец — платный.
#  /rc reload — применить без рестарта.
#  1.10.0: добавлены спеки Чернокнижника (black_mage, hell_channel).
#  1.14.0: расширение до 18 спеков (3 на класс) + legacy для обратной совместимости.
# ============================================================

specs:
  # ---------- ВОИН (3 спеки) ----------
  guardian:
    passive:
      id: guardian
      description: "Стоическая стойка: +10% физрезиста постоянно"
      physical: 10
    active:
      id: challenge
      description: "Вызов: таунт мобов в радиусе 6 на 4 с"
      cost: 20
      cooldown: 40
      duration: 4
      radius: 6.0
  berserker:
    passive:
      id: berserker
      description: "Ярость севера: +15% урона, пока HP ≥ 60%"
      damage_pct: 15
      threshold: 0.60
    active:
      id: rage_burst
      description: "Всплеск ярости: +4 урона к следующей атаке, КД 8 с"
      cost: 15
      cooldown: 8
      bonus: 4.0
  arms:
    passive:
      id: arms
      description: "Оружейник: +12% урона при HP ≥ 80%, казнь срабатывает чаще"
      damage_pct: 12
      threshold: 0.80
    active:
      id: bladestorm
      description: "Шторм клинков: AoE урон в радиусе 4 на 3 с"
      cost: 30
      cooldown: 60
      duration: 3
      radius: 4.0

  # ---------- ОХОТНИК (3 спеки) ----------
  marksman:
    passive:
      id: marksman
      description: "Глаз сокола: +10% шанса крита стрелами"
      crit_bonus: 10
    active:
      id: precise_shot
      description: "Точный выстрел: следующий выстрел игнорирует 50% резиста цели"
      cost: 20
      cooldown: 25
  survival:
    passive:
      id: survival
      description: "Следопыт: видишь HP цели и её подсветку 6 с после удара"
      track_duration: 6
    active:
      id: snare
      description: "Силки: Slowness III на 3 с по цели в радиусе 4"
      cost: 20
      cooldown: 30
      duration: 3
      radius: 4.0
  beast_master:
    passive:
      id: beast_master
      description: "Повелитель зверей: +15% к урону питомца, реген Концентрации +1/с"
      pet_bonus: 15
    active:
      id: bestial_wrath
      description: "Звериная ярость: питомец +50% урона на 10 с"
      cost: 30
      cooldown: 60
      duration: 10

  # ---------- ЖРЕЦ (3 спеки) ----------
  holy:
    passive:
      id: holy
      description: "Светоносец: ×1.2 к исходящему лечению"
      heal_multiplier: 1.20
    active:
      id: sanctuary
      description: "Санктуарий: реген 2 HP/с себе и союзникам в радиусе 4 на 5 с"
      cost: 30
      cooldown: 45
      duration: 5
      radius: 4.0
      regen: 2.0
  shadowweaver:
    passive:
      id: shadowweaver
      description: "Ткач теней: 15% лифстила от исходящего маг-урона"
      lifesteal_pct: 15
    active:
      id: mind_spike
      description: "Шип разума: маг-урон 12 + Blind 2 с по цели"
      cost: 25
      cooldown: 20
      damage: 12.0
      duration: 2
  discipline:
    passive:
      id: discipline
      description: "Послушание: +10% к силе щитов, Искупление лечит от урона"
      shield_bonus: 10
    active:
      id: penance
      description: "Исповедь: 3 заряда лечения/урона по цели"
      cost: 25
      cooldown: 12
      charges: 3

  # ---------- МАГ (3 спеки) ----------
  arcane:
    passive:
      id: arcane
      description: "Тайный поток: +1 маны/с сверх регена класса"
      mana_regen: 1.0
    active:
      id: arcane_flow
      description: "Поток: следующий каст стоит 0 маны, КД 30 с"
      cost: 0
      cooldown: 30
  frost:
    passive:
      id: frost
      description: "Мороз: твои маг-атаки замедляют цель на 1 с"
      slow_duration: 1
    active:
      id: ice_ring
      description: "Кольцо льда: Slowness II 3 с всем врагам в радиусе 4"
      cost: 30
      cooldown: 35
      duration: 3
      radius: 4.0
  fire:
    passive:
      id: fire
      description: "Огонь: +20% к длительности горения DoT, крит поджигает"
      dot_duration_bonus: 20
    active:
      id: combustion
      description: "Возгорание: +30% к маг-урону на 8 с"
      cost: 40
      cooldown: 90
      duration: 8

  # ---------- РАЗБОЙНИК (3 спеки) ----------
  assassin:
    passive:
      id: assassin
      description: "Ликвидатор: +15% шанса крита ×1.5 в ближнем бою"
      crit_chance: 15
      crit_mult: 1.5
    active:
      id: garrote
      description: "Гаррота: урон 8 + Slowness I 2 с по цели спереди"
      cost: 20
      cooldown: 18
      damage: 8.0
      duration: 2
  outlaw:
    passive:
      id: outlaw
      description: "Головорез: +15% шанса уклонения"
      dodge_chance: 15
    active:
      id: smoke_bomb
      description: "Дымовая шашка: Blind 2 с всем врагам в радиусе 3"
      cost: 25
      cooldown: 30
      duration: 2
      radius: 3.0
  subtlety:
    passive:
      id: subtlety
      description: "Скрытность: +25% урона из невидимости, первый удар сбивает с ног"
      stealth_bonus: 25
    active:
      id: shadow_dance
      description: "Танец теней: вход в стелс на 5 с"
      cost: 30
      cooldown: 60
      duration: 5

  # ---------- ЧЕРНОКНИЖНИК (3 спеки, 1.14.0) ----------
  affliction:
    passive:
      id: affliction
      description: "Колдовство: +10% урона способностей; DoT висят на 30% дольше; «Небытие» стирает 1 резист"
      dot_duration_bonus: 30
  destruction:
    passive:
      id: destruction
      description: "Разрушение: +15% урона способностей FIRE; крит поджигает на 6 с"
      damage_bonus: 15
  demonology:
    passive:
      id: demonology
      description: "Демонология: +10% урона способностей; +6% магрезиста; пет получает +20% HP"
      pet_hp_bonus: 20

  # ---------- LEGACY (1.13.0 и ранее, для обратной совместимости) ----------
  # Эти спеки остаются для игроков, выбравших их до 1.14.0.
  # Новые игроки увидят только 18 спеков выше.
  tracker:
    passive:
      id: tracker
      description: "Следопыт: видишь HP цели и её подсветку 6 с после удара"
      track_duration: 6
    active:
      id: snare
      description: "Силки: Slowness III на 3 с по цели в радиусе 4"
      cost: 20
      cooldown: 30
      duration: 3
      radius: 4.0
  lightbearer:
    passive:
      id: lightbearer
      description: "Светоносец: ×1.2 к исходящему лечению"
      heal_multiplier: 1.20
    active:
      id: sanctuary
      description: "Санктуарий: реген 2 HP/с себе и союзникам в радиусе 4 на 5 с"
      cost: 30
      cooldown: 45
      duration: 5
      radius: 4.0
      regen: 2.0
  liquidator:
    passive:
      id: liquidator
      description: "Ликвидатор: +15% шанса крита ×1.5 в ближнем бою"
      crit_chance: 15
      crit_mult: 1.5
    active:
      id: garrote
      description: "Гаррота: урон 8 + Slowness I 2 с по цели спереди"
      cost: 20
      cooldown: 18
      damage: 8.0
      duration: 2
  trickster:
    passive:
      id: trickster
      description: "Трюкач: +15% шанса уклонения"
      dodge_chance: 15
    active:
      id: smoke_bomb
      description: "Дымовая шашка: Blind 2 с всем врагам в радиусе 3"
      cost: 25
      cooldown: 30
      duration: 2
      radius: 3.0
  black_mage:
    passive:
      id: black_mage
      description: "Чёрный Маг: +10% урона способностей; «Небытие» стирает также 1 резист-модификатор"
  hell_channel:
    passive:
      id: hell_channel
      description: "Адский Канал: Скверна рассеивается вдвое медленнее; «Печать Погибели» держится 86.6 с"
