# ============================================================
#  RaskolClasses v1.11.0 — Специализации классов
#  Выбор на 40 уровне, один раз, бесплатно. Респец — платный (Пакет 3).
#  /rc reload — применить без рестарта.
#  ВНИМАНИЕ: активки спеков удалены в 1.7.5 (спека = пассивная идентичность);
#  секции active: ниже — legacy для старых спек, живут до чистки 1.7.x-хвостов.
#  Passive-ключи читает SpecListener/SpecService с фолбэками в коде —
#  отсутствующий ключ не ломает старт, берётся дефолт из кода.
#  1.10.0: добавлены спеки Чернокнижника (black_mage, hell_channel);
#  active-секций у них нет (пассивная идентичность с рождения линии).
# ============================================================

specs:
  # ---------- ВОИН ----------
  guardian:
    passive:
      id: guardian
      description: "Стоическая стойка: +10% физрезиста постоянно"
      physical: 10
    active:
      id: challenge
      description: "Вызов: таунт мобов в радиусе 6 на 4 с"
      cost: 20
      cooldown: 40
      duration: 4
      radius: 6.0
  berserker:
    passive:
      id: berserker
      description: "Ярость севера: +15% урона, пока HP ≥ 60%"
      damage_pct: 15
      threshold: 0.60
    active:
      id: rage_burst
      description: "Всплеск ярости: +4 урона к следующей атаке, КД 8 с"
      cost: 15
      cooldown: 8
      bonus: 4.0
  # ---------- ОХОТНИК ----------
  marksman:
    passive:
      id: marksman
      description: "Глаз сокола: +10% шанса крита стрелами"
      crit_bonus: 10
    active:
      id: precise_shot
      description: "Точный выстрел: следующий выстрел игнорирует 50% резиста цели"
      cost: 20
      cooldown: 25
  tracker:
    passive:
      id: tracker
      description: "Следопыт: видишь HP цели и её подсветку 6 с после удара"
      track_duration: 6
    active:
      id: snare
      description: "Силки: Slowness III на 3 с по цели в радиусе 4"
      cost: 20
      cooldown: 30
      duration: 3
      radius: 4.0
  # ---------- ЖРЕЦ ----------
  lightbearer:
    passive:
      id: lightbearer
      description: "Светоносец: ×1.2 к исходящему лечению"
      heal_multiplier: 1.20
    active:
      id: sanctuary
      description: "Санктуарий: реген 2 HP/с себе и союзникам в радиусе 4 на 5 с"
      cost: 30
      cooldown: 45
      duration: 5
      radius: 4.0
      regen: 2.0
  shadowweaver:
    passive:
      id: shadowweaver
      description: "Ткач теней: 15% лифстила от исходящего маг-урона"
      lifesteal_pct: 15
    active:
      id: mind_spike
      description: "Шип разума: маг-урон 12 + Blind 2 с по цели"
      cost: 25
      cooldown: 20
      damage: 12.0
      duration: 2
  # ---------- МАГ ----------
  arcane:
    passive:
      id: arcane
      description: "Тайный поток: +1 маны/с сверх регена класса"
      mana_regen: 1.0
    active:
      id: arcane_flow
      description: "Поток: следующий каст стоит 0 маны, КД 30 с"
      cost: 0
      cooldown: 30
  frost:
    passive:
      id: frost
      description: "Мороз: твои маг-атаки замедляют цель на 1 с"
      slow_duration: 1
    active:
      id: ice_ring
      description: "Кольцо льда: Slowness II 3 с всем врагам в радиусе 4"
      cost: 30
      cooldown: 35
      duration: 3
      radius: 4.0
  # ---------- РАЗБОЙНИК ----------
  liquidator:
    passive:
      id: liquidator
      description: "Ликвидатор: +15% шанса крита ×1.5 в ближнем бою"
      crit_chance: 15
      crit_mult: 1.5
    active:
      id: garrote
      description: "Гаррота: урон 8 + Slowness I 2 с по цели спереди"
      cost: 20
      cooldown: 18
      damage: 8.0
      duration: 2
  trickster:
    passive:
      id: trickster
      description: "Трюкач: +15% шанса уклонения"
      dodge_chance: 15
    active:
      id: smoke_bomb
      description: "Дымовая шашка: Blind 2 с всем врагам в радиусе 3"
      cost: 25
      cooldown: 30
      duration: 2
      radius: 3.0
  # ---------- ЧЕРНОКНИЖНИК (1.10.0, скрытый класс) ----------
  black_mage:
    passive:
      id: black_mage
      description: "Чёрный Маг: +10% урона способностей; «Небытие» стирает также 1 резист-модификатор; зона «Раскола Души» шире на 2 блока"
      damage_pct: 10
      unwriting_strips_resist: 1
      soul_rift_radius_bonus: 2.0
  hell_channel:
    passive:
      id: hell_channel
      description: "Адский Канал: Скверна рассеивается вдвое медленнее; «Печать Погибели» держится 86.6 с; запрет лечения +3 с; +6% магрезиста"
      magic: 6
      corruption_decay: -2.0
      seal_duration: 86.6
      antiheal_bonus: 3
