# ============================================================
#  RaskolClasses · builds.yml · схема v1
#  Кураторские шаблоны билдов raskolspec+ (подписка).
#  Извлекается из jar при первом старте; правится админом без пересборки.
#  /rc reload — перечитать. Ошибочный шаблон отключается с warning,
#  остальные работают.
#
#  Цена и срок:
#    plus.price-per-period: 100   (империалов за период)
#    plus.period-days:      30    (дней в периоде)
#  Покупка через PlayerPoints, витрина — через DeluxeMenus.
#  1.14.15 (raskolspec+): 36 шаблонов (18 спек × 2 архетипа).
# ============================================================
