schema-version: 1

# Curated level bands × class gear templates. Names and set identity are server-owned content.
settings:
  max-item-level: 60
  generated-levels: [20, 40, 60]
  generated-rarities: [COMMON, RARE, EPIC]
  weapon-types:
    SWORD:
      materials: [IRON_SWORD]
      classes: [WARRIOR, ROGUE]
      damage-type: PHYSICAL
    AXE:
      materials: [IRON_AXE]
      classes: [WARRIOR]
      damage-type: PHYSICAL
    MACE:
      materials: [MACE]
      classes: [WARRIOR, PRIEST]
      damage-type: PHYSICAL
    DAGGER:
      materials: [IRON_SWORD]
      classes: [ROGUE]
      damage-type: PHYSICAL
    BOW:
      materials: [BOW]
      classes: [HUNTER]
      damage-type: PHYSICAL
    CROSSBOW:
      materials: [CROSSBOW]
      classes: [HUNTER]
      damage-type: PHYSICAL
    SPEAR:
      materials: [TRIDENT]
      classes: [HUNTER, WARRIOR]
      damage-type: PHYSICAL
    STAFF:
      materials: [BLAZE_ROD]
      classes: [PRIEST, MAGE, WARLOCK]
      damage-type: MAGIC
    WAND:
      materials: [BLAZE_ROD]
      classes: [PRIEST, MAGE, WARLOCK]
      damage-type: MAGIC
  budget:
    rarity-mult: { COMMON: 1.0, UNCOMMON: 1.15, RARE: 1.35, EPIC: 1.6, LEGENDARY: 1.9, MYTHIC: 2.3 }
    slot-weight: { MAIN_HAND: 1.0, CHEST: 0.9, LEGS: 0.8, HEAD: 0.6, FEET: 0.5, OFF_HAND: 0.5 }
    stat-cost:
      weapon-power: 1.0
      spell-power: 1.0
      heal-power: 1.0
      str: 1.5
      agi: 1.5
      int: 1.5
      hp-bonus: 0.25
      phys-resist: 8.0
      magic-resist: 8.0
      pen-phys-pct: 8.0
      pen-magic-pct: 8.0
      crit-melee: 10.0
      crit-spell: 10.0
      crit-damage: 10.0
      attack-damage: 0.5

