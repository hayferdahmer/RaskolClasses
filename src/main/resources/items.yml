schema-version: 1

# Default generated stock: 6 classes × 5 equipment slots × 3 levels × 3 rarities = 270.
# Every stat in a generated template has a consumer in the 1.15.0 combat pipeline.
settings:
  max-item-level: 60
  generated-levels: [20, 40, 60]
  generated-rarities: [COMMON, RARE, EPIC]
  weapon-types:
    SWORD: { materials: [IRON_SWORD, DIAMOND_SWORD, NETHERITE_SWORD], classes: [WARRIOR], damage-type: PHYSICAL }
    AXE: { materials: [IRON_AXE, DIAMOND_AXE, NETHERITE_AXE], classes: [WARRIOR], damage-type: PHYSICAL }
    MACE: { materials: [MACE], classes: [WARRIOR, PRIEST], damage-type: PHYSICAL }
    DAGGER: { materials: [IRON_SWORD, GOLDEN_SWORD], classes: [ROGUE], damage-type: PHYSICAL }
    BOW: { materials: [BOW, CROSSBOW], classes: [HUNTER], damage-type: PHYSICAL }
    STAFF: { materials: [BLAZE_ROD, STICK], classes: [MAGE, PRIEST, WARLOCK], damage-type: MAGIC }
  budget:
    rarity-mult: { COMMON: 1.0, UNCOMMON: 1.15, RARE: 1.35, EPIC: 1.6, LEGENDARY: 1.9, MYTHIC: 2.3 }
    slot-weight: { MAIN_HAND: 1.0, CHEST: 0.9, LEGS: 0.8, HEAD: 0.6, FEET: 0.5, OFF_HAND: 0.5 }
    stat-cost:
      weapon-power: 1.0
      spell-power: 1.0
      heal-power: 1.0
      str: 1.5
      agi: 1.5
      int: 1.5
      hp-bonus: 0.25
      phys-resist: 8.0
      magic-resist: 8.0
      pen-phys-pct: 8.0
      pen-magic-pct: 8.0
      crit-melee: 10.0
      crit-spell: 10.0
      crit-damage: 10.0
      attack-damage: 0.5

