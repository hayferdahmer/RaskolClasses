# ============================================================
#  RaskolClasses v1.7.2 — сервер «РАСКОЛ | ДВЕ КОРОНЫ»
#  Весь баланс, стилизация и длительности — в этом файле.
#  Применение без рестарта: /rc reload (кроме hp-display.mode — рестарт).
#  Новые ключи дописываются автоматически (addDefault + copyDefaults),
#  правки админа не затираются.
#  1.7.0: атрибуты, HP-реформа, avoidance, офенс/криты, среда=TRUE.
#  1.7.1: производные статы WP/SP/HPow + базовый урон + анти-ваншот 35%.
#  1.7.2: киты Воина (нордика) и Охотника (средневековье других вселенных):
#         новые id, формулы base + WP×coeff, новые vfx-записи под новые id.
# ============================================================

hud:
  enabled: true               # ресурсная строка HudService (только при hp-display.mode: vanilla)
  update-period-ticks: 10     # период HUD-тика (O5)
  skip-spectator: true        # не слать actionbar зрителям (O8)
  full-resource-aura: true    # партикл темы раз в 20 тиков при ресурсе 100 (§4.5)
  debug-skip: false           # лог пропусков dirty-rendering — для проверки O1
  boss-bar:
    enabled: true             # босс-бары длительных эффектов (НЕ для HP)
    min-duration-seconds: 8   # порог показа (эффекты с меньшей длительностью скрыты)
    max-visible: 2            # максимум баров одновременно (топ-N по оставшемуся времени)
    tick-period: 5            # период опроса эффектов, в тиках
    format: "{name} — {sec}с"
    format-infinite: "{name}"

performance:
  purge-interval-ticks: 1200    # чистка истёкших кулдаунов и флагов (O7)
  cast-click-cooldown-ms: 150   # анти-спам дабл-клика каста (O12)
  sound-budget-per-tick: 8      # 1.5.7: максимум sound-событий за тик на сервер
  ready-notify:
    enabled: true             # звук + actionbar при окончании КД
    min-cooldown-seconds: 30  # порог: уведомлять только о длинных КД
    sound: ENTITY_PLAYER_LEVELUP
    message: "{ability} — готова"
    spec-enabled: true        # 1.5.1: готовность спек-активки озвучивается отдельно

hooks:
  raskolcore:
    enabled: true             # читать класс из паспорта RaskolCore (LP — фолбэк)

hotbar-bind:
  enabled: true               # свитки способностей (Книга класса / свитки в хотбаре)
  material: AMETHYST_SHARD    # материал классового свитка (спец-свиток — NETHER_STAR)
  cooldown-bar: true          # 1.5.6: полоска перезарядки на свитке в хотбаре

target-cast:
  enabled: true               # ЛКМ со свитком точечной способности по игроку = каст в цель
  debug: false                # true — точки обрыва ЛКМ-каста в чат ([dbg] ...)

# 1.5.8: совместимость и края
compat:
  authme-gate: true             # неаутентифицированные (AuthMe, до /login) не пользуют свитки/касты
  block-casts-in-creative: true # способности недоступны в creative (кроме raskolclasses.admin)

# 1.6.2 + 1.6.9 + 1.6.11 + 1.7.1: справедливость боя и рубильники
combat:
  friendly-fire: false   # false = союзники не получают наш урон, хилы не ложатся на врагов
  debug-damage: false    # 1.6.4: боевой лог нашего урона для админов (raskolclasses.debug)
  true-damage-cap-per-hit: 1000   # 1.6.9: предохранитель компоненты true за один вызов
  aoe-los: true          # 1.6.11: AoE-урон не проходит сквозь стены
  # 1.7.1: АНТИ-ВАНШОТ — одиночный.hit по игроку не снимает больше N% его max HP
  # (после резистов/критов). Исключения — среда (летальна по дизайну) и execute-финишеры.
  max-single-hit-pct: 35
  cap-exempt-causes:
    - FALL
    - DROWNING
    - SUFFOCATION
    - STARVATION
    - VOID
    - SONIC_BOOM

# 1.6.10: надёжность хранения
storage:
  autosave-minutes: 5   # период автосейва cooldowns.yml + spec-choices.yml

class-accept:
  enabled: true               # титр при первом принятии класса (раз в сессию)
  subtitle: "Твой путь избран"

# 1.4.0 / Пакет 3: платный респец (money-sink)
spec:
  respec-base-cost: 250       # базовая цена сброса спеки
  respec-per-level: 10        # +10 за каждый уровень профильного скилла

# 1.6.0: система сопротивлений урону (РЕЗИСТ)
resist:
  cap: 90                     # максимум суммарного резиста, %
  pvp-cap: 90                 # 1.6.9: отдельный кап резиста для урона от игроков
  disabled-worlds: []         # 1.6.9: миры без резистов (арены/хабы)
  classes:
    WARRIOR:
      magic: 12
      physical: 27
    ROGUE:
      magic: 12
      physical: 14
    MAGE:
      magic: 26
      physical: 12
    PRIEST:
      magic: 30
      physical: 16
    HUNTER:
      magic: 12
      physical: 16
  grants:
    steel_skin:
      physical: 15            # (legacy id, мертва с 1.7.2; оставлена для старых сейвов)
    evasion:
      physical: 30
    balder_skin:
      physical: 15            # 1.7.2: грант Шкуры Бальдра для лора Книги (реально скалируется от WP)
  mana-soaked:
    enabled: true
    physical: 15
    magic: 15
  specs:
    guardian:
      physical: 10

# ------------------------------------------------------------
# 1.7.0: КЛАССОВЫЕ АТРИБУТЫ (СИЛА / ЛОВКОСТЬ / ИНТЕЛЛЕКТ)
# Значение = base + growth×PlayerLevel + модификаторы.
# ------------------------------------------------------------
attributes:
  level-source: class-skill   # class-skill | vanilla
  classes:
    WARRIOR: { main: STR, base-str: 12, base-agi: 6,  base-int: 4,  growth-str: 1.2, growth-agi: 0.5, growth-int: 0.3 }
    HUNTER:  { main: AGI, base-str: 6,  base-agi: 12, base-int: 4,  growth-str: 0.5, growth-agi: 1.2, growth-int: 0.3 }
    ROGUE:   { main: AGI, base-str: 7,  base-agi: 11, base-int: 4,  growth-str: 0.6, growth-agi: 1.1, growth-int: 0.3 }
    MAGE:    { main: INT, base-str: 4,  base-agi: 6,  base-int: 12, growth-str: 0.3, growth-agi: 0.5, growth-int: 1.2 }
    PRIEST:  { main: INT, base-str: 5,  base-agi: 5,  base-int: 12, growth-str: 0.4, growth-agi: 0.4, growth-int: 1.2 }
  hp:
    base-hp: 100            # базовое HP любого класса
    per-str: 20             # HP за единицу СИЛЫ
    per-level: 0            # (legacy) HP за уровень — не влияет
    main-str-bonus: 0       # (legacy) бонус STR-основному — не влияет
    regen-per-str: 0.025        # HP/сек за единицу СИЛЫ вне боя (нерф 1.7.0.4)
    regen-combat-factor: 0.35   # множитель регена в бою
    regen-cap-pct: 1.5          # кап регена: % от maxHP в секунду
  # 1.7.1: ПРОИЗВОДНЫЕ СТАТЫ (WP/SP/HPow) — единственный источник силы урона/хилов
  power:
    str-to-wp: 1.5
    agi-to-wp: 0.5
    int-to-sp: 1.5
    int-to-hpow: 1.4
    base-wp:  { WARRIOR: 30, HUNTER: 35, ROGUE: 30, MAGE: 5,  PRIEST: 10 }
    base-sp:  { WARRIOR: 5,  HUNTER: 5,  ROGUE: 5,  MAGE: 30, PRIEST: 25 }
    base-hpow:{ WARRIOR: 0,  HUNTER: 0,  ROGUE: 0,  MAGE: 15, PRIEST: 25 }
  offense:
    basic-coeff: 0.35        # 1.7.1: базовый удар = ванильное оружие + WP × coeff
    basic-coeff-magic: 0.35  # 1.7.1: ванильная магия игрока = SP × coeff
    str-to-physical: false   # (legacy, ВЫКЛ) плоский бонус STR+level заменён WP
    int-to-magic: false      # (legacy, ВЫКЛ) плоский бонус INT+level заменён SP
  crit:
    melee-base: 5
    melee-per-agi: 0.05
    melee-cap: 40
    melee-mult: 1.5
    spell-base: 5
    spell-per-int: 0.03
    spell-cap: 35
    spell-mult: 1.5
    spell-main-mult: 1.5
    visuals: true
    melee-tag: "⚡ Крит!"
    spell-tag: "✦ Магический крит!"
    melee-sound: ENTITY_PLAYER_ATTACK_CRIT
    spell-sound: ENTITY_EVOKER_CAST_SPELL
  avoidance:
    dodge-k: 100
    parry-k: 150
    soft-cap: 60
    dr-factor: 0.5
    hard-cap: 75
    agi-main-parry-micro: 0.5
    agi-main-dodge-refund: 0.5
    front-angle: 90
    back-angle: 135
    parry-stagger-player-ms: 600
    parry-stagger-mob-ms: 500
  hp-display:
    mode: actionbar
    gauge: true
    gauge-length: 10
    hearts-scale: 20.0
    update-period-ticks: 10
    colors:
      frame: "#8B5A3C"
      gauge-empty: "#6E5232"
      numbers: "#D6CDBE"
    gradient:
      enabled: true
      hp-start: "#5C0F0F"
      hp-end: "#C82020"
      res-start: "#8B5A3C"
      res-end: "#D6A642"
    regen-spark:
      enabled: true
      color: "#F5E6B8"
    format: "❤ {hp}/{max}"
  boss-no-avoidance: []

# 1.6.0 + 1.7.0.2: типы ванильных причин урона (physical|magic|true)
damage-types:
  env-lethal-scale: true
  env-lethal:
    - FALL
    - DROWNING
    - SUFFOCATION
    - STARVATION
  vanilla-map:
    SONIC_BOOM: 'true'
    VOID: 'true'
    FALL: 'true'
    DROWNING: 'true'
    SUFFOCATION: 'true'
    STARVATION: 'true'
    FIRE: magic
    FIRE_TICK: magic
    LAVA: magic
    HOT_FLOOR: magic
    POISON: magic
    WITHER: magic
    MAGIC: magic
    DRAGON_BREATH: magic
    FREEZING: magic
    LIGHTNING: magic

