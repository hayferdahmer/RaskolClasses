# ============================================================
#  RaskolClasses v1.9.0 — «РАСКОЛ | ДВЕ КОРОНЫ»
#  Весь баланс, стилизация и длительности — в этом файле.
#  Применение: ПОЛНАЯ замена файла + рестарт сервера.
#  1.9.0: дерево талантов спеки (Книга класса, вкладка TALENTS):
#         секция talents + сообщения book.tab.talents / talents.reset.*.
# ============================================================

hud:
  enabled: true
  update-period-ticks: 10
  skip-spectator: true
  full-resource-aura: true
  debug-skip: false
  boss-bar:
    enabled: true
    min-duration-seconds: 8
    max-visible: 2
    tick-period: 5
    format: "{name} — {sec}с"
    format-infinite: "{name}"

performance:
  purge-interval-ticks: 1200
  cast-click-cooldown-ms: 150
  sound-budget-per-tick: 8
  ready-notify:
    enabled: true
    min-cooldown-seconds: 30
    sound: ENTITY_PLAYER_LEVELUP
    message: "{ability} — готова"
    spec-enabled: true

hooks:
  raskolcore:
    enabled: true

hotbar-bind:
  enabled: true
  material: AMETHYST_SHARD
  cooldown-bar: true

target-cast:
  enabled: true
  debug: false

compat:
  authme-gate: true
  block-casts-in-creative: true

# ------------------------------------------------------------
# Бой: резист-гейты, анти-ваншот, burst-окно, LOS
# ------------------------------------------------------------
combat:
  friendly-fire: false
  debug-damage: false
  true-damage-cap-per-hit: 1000
  aoe-los: true
  max-single-hit-pct: 35
  cap-exempt-causes:
    - FALL
    - DROWNING
    - SUFFOCATION
    - STARVATION
    - VOID
    - SONIC_BOOM
  burst-window-seconds: 3.0
  burst-window-pct: 18.0

storage:
  autosave-minutes: 5

class-accept:
  enabled: true
  subtitle: "Твой путь избран"

# 1.7.6: якорь TTK-харнесса (подсветка матрицы ±30%)
balance:
  target-ttk-seconds: 20.0

# ------------------------------------------------------------
# 1.8.0: УРОВЕНЬ ПЕРСОНАЖА — сводная прогрессия
# Уровень = floor(среднее топ-N скиллов AuraSkills), зажат в [0, level-cap].
# Атрибуты растут от него; одиночное дерево до 99 не раздувает статы.
# Анлоки способностей остаются на профильном скилле.
# ------------------------------------------------------------
character-level:
  top-n: 5
  fallback: 40
  skills:
    - fighting
    - defense
    - archery
    - agility
    - healing
    - sorcery
    - alchemy
    - enchanting
    - mining
    - forging

# ------------------------------------------------------------
# 1.9.0: ТАЛАНТЫ СПЕКИ (дерево в Книге класса, вкладка TALENTS)
# Очки: earned = clamp(charLevel − start-level + 1, 0, max-points) × points-per-level.
# Полное дерево = 21 очко (2×1 + 4×2 + 2×3 + 1×5) = max-points.
# Сброс: кристалл в Книге (ПКМ ×2, окно 30 с); цена = reset-base + reset-per-point × потрачено.
# Админ с raskolclasses.admin сбрасывает бесплатно.
# ------------------------------------------------------------
talents:
  enabled: true
  start-level: 40
  points-per-level: 1
  max-points: 21
  reset-base: 500
  reset-per-point: 25

spec:
  respec-base-cost: 250
  respec-per-level: 10

# ------------------------------------------------------------
# Резисты (1.6.0 + 1.7.6.2: воин физ 18)
# ------------------------------------------------------------
resist:
  cap: 90
  pvp-cap: 90
  disabled-worlds: []
  classes:
    WARRIOR:
      magic: 12
      physical: 18
    ROGUE:
      magic: 12
      physical: 14
    MAGE:
      magic: 26
      physical: 12
    PRIEST:
      magic: 30
      physical: 16
    HUNTER:
      magic: 12
      physical: 16
  grants:
    steel_skin:
      physical: 15
    evasion:
      physical: 30
    balder_skin:
      physical: 15
    aegis_faith:
      physical: 12
      magic: 12
  mana-soaked:
    enabled: true
    physical: 15
    magic: 15
  specs:
    guardian:
      physical: 10

# ------------------------------------------------------------
# Атрибуты (1.7.0 + 1.8.0: level-source/level-cap + 1.8.1: parry-k 300, dodge-mult 0.5)
# ------------------------------------------------------------
attributes:
  level-source: character   # character | class-skill | vanilla
  level-cap: 60
  classes:
    WARRIOR: { main: STR, base-str: 12, base-agi: 6,  base-int: 4,  growth-str: 1.2, growth-agi: 0.5, growth-int: 0.3 }
    HUNTER:  { main: AGI, base-str: 6,  base-agi: 12, base-int: 4,  growth-str: 0.5, growth-agi: 1.2, growth-int: 0.3 }
    ROGUE:   { main: AGI, base-str: 7,  base-agi: 11, base-int: 4,  growth-str: 0.6, growth-agi: 1.1, growth-int: 0.3 }
    MAGE:    { main: INT, base-str: 4,  base-agi: 6,  base-int: 12, growth-str: 0.3, growth-agi: 0.5, growth-int: 1.2 }
    PRIEST:  { main: INT, base-str: 5,  base-agi: 5,  base-int: 12, growth-str: 0.4, growth-agi: 0.4, growth-int: 1.2 }
  hp:
    base-hp: 100
    per-str: 20
    per-level: 0
    main-str-bonus: 0
    regen-per-str: 0.025
    regen-combat-factor: 0.35
    regen-cap-pct: 1.5
  power:
    str-to-wp: 1.5
    agi-to-wp: 0.5
    int-to-sp: 1.5
    int-to-hpow: 1.4
    base-wp:  { WARRIOR: 30, HUNTER: 35, ROGUE: 30, MAGE: 5,  PRIEST: 10 }
    base-sp:  { WARRIOR: 5,  HUNTER: 5,  ROGUE: 5,  MAGE: 30, PRIEST: 25 }
    base-hpow:{ WARRIOR: 0,  HUNTER: 0,  ROGUE: 0,  MAGE: 15, PRIEST: 25 }
  offense:
    basic-coeff: 0.35
    basic-coeff-magic: 0.35
    str-to-physical: false
    int-to-magic: false
  crit:
    melee-base: 5
    melee-per-agi: 0.05
    melee-cap: 40
    melee-mult: 1.5
    spell-base: 5
    spell-per-int: 0.03
    spell-cap: 35
    spell-mult: 1.5
    spell-main-mult: 1.5
    visuals: true
    melee-tag: "⚡ Крит!"
    spell-tag: "✦ Магический крит!"
    melee-sound: ENTITY_PLAYER_ATTACK_CRIT
    spell-sound: ENTITY_EVOKER_CAST_SPELL
  avoidance:
    dodge-k: 100
    parry-k: 300
    soft-cap: 60
    dr-factor: 0.5
    hard-cap: 75
    dodge-mult: 0.5
    agi-main-parry-micro: 0.5
    agi-main-dodge-refund: 0.5
    front-angle: 90
    back-angle: 135
    parry-stagger-player-ms: 600
    parry-stagger-mob-ms: 500
  hp-display:
    mode: actionbar
    gauge: true
    gauge-length: 10
    hearts-scale: 20.0
    update-period-ticks: 10
    colors:
      frame: "#8B5A3C"
      gauge-empty: "#6E5232"
      numbers: "#D6CDBE"
    gradient:
      enabled: true
      hp-start: "#5C0F0F"
      hp-end: "#C82020"
      res-start: "#8B5A3C"
      res-end: "#D6A642"
    regen-spark:
      enabled: true
      color: "#F5E6B8"
    format: "❤ {hp}/{max}"
  boss-no-avoidance: []

# ------------------------------------------------------------
# Типы урона ванильных причин (среда = TRUE)
# ------------------------------------------------------------
damage-types:
  env-lethal-scale: true
  env-lethal:
    - FALL
    - DROWNING
    - SUFFOCATION
    - STARVATION
  vanilla-map:
    SONIC_BOOM: 'true'
    VOID: 'true'
    FALL: 'true'
    DROWNING: 'true'
    SUFFOCATION: 'true'
    STARVATION: 'true'
    FIRE: magic
    FIRE_TICK: magic
    LAVA: magic
    HOT_FLOOR: magic
    POISON: magic
    WITHER: magic
    MAGIC: magic
    DRAGON_BREATH: magic
    FREEZING: magic
    LIGHTNING: magic

