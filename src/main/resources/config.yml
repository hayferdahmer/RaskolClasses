# 1.5.0 / Пакет 2 + 1.5.2 + 1.5.8 + 1.6.0: инсталляции (ставящиеся мины/варды)
installations:
  unlock-level: 50            # уровень профильного скилла (админ — без лимита)
  max-per-player: 2           # активных одновременно на игрока
  max-global: 200             # 1.5.2: глобальный кап активных инсталляций на сервере
  place-anti-spam-ms: 1000    # 1.5.2: пауза между постановками одного игрока
  notify-owner: true          # 1.5.2: actionbar владельцу «сработала на X» / «истекла»
  ttl-seconds: 60             # время жизни
  deny-radius-spawn: 100      # запрет постановки в радиусе от спавна мира
  deny-in-claims: true        # запрет на заклэймленной земле Towny
  deny-outside-border: true   # 1.5.8: запрет постановки за мировой границей
  war_banner:
    radius: 6.0
    duration: 8               # секунд Resistance I союзникам
  light_ward:
    radius: 4.0
    heal: 2.0                 # HP в секунду союзникам
  bear_trap:
    damage-physical: 3        # 1.6.0 пакет 2: капкан = физический урон
    slow-duration: 2          # Slowness VI
  frost_rune:
    radius: 3.0
    damage-magic: 4           # 1.6.0 пакет 2: руна = магический урон
    slow-duration: 3          # Slowness II
  smoke_bomb:
    radius: 3.0
    blind-duration: 2         # Blindness врагам
    speed-duration: 3         # Speed I владельцу

