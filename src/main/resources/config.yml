# ============================================================
#  RaskolClasses v1.1.0 — сервер «РАСКОЛ | ДВЕ КОРОНЫ»
#  Весь баланс, стилизация и длительности — в этом файле.
#  Применение без рестарта: /rc reload.
#  Новые ключи дописываются автоматически (addDefault + copyDefaults),
#  правки админа не затираются.
# ============================================================

hud:
  enabled: true               # ActionBar-строка
  update-period-ticks: 10     # период HUD-тика (O5)
  skip-spectator: true        # не слать actionbar зрителям (O8)
  full-resource-aura: true    # партикл темы раз в 20 тиков при ресурсе 100 (§4.5)
  debug-skip: false           # лог пропусков dirty-rendering — для проверки O1

performance:
  purge-interval-ticks: 1200  # чистка истёкших кулдаунов и флагов (O7)
  cast-click-cooldown-ms: 150 # анти-спам дабл-клика каста (O12)

classes:
  WARRIOR:
    resource-regen: -5.0        # ярость: −5/с вне боя
    resource-on-deal: 10.0      # +10 за нанесённый урон (кап 1 событие/с)
    resource-on-take: 10.0      # +10 за полученный урон
    resource-on-heal: 0.0
    combat-window-seconds: 5
    theme:
      primary: "#8B0000"
      secondary: "#FF4500"
      symbol: "⚔"
    cast-sound: ENTITY_PLAYER_LEVELUP
    cast-particle: FLAME
    abilities:
      shield_wall:   { name: "Щит-стена",    unlock: 10, cost: 30,  cooldown: 45,  duration: 6 }
      shield_bash:   { name: "Удар щитом",   unlock: 25, cost: 20,  cooldown: 20,  duration: 3 }
      execute:       { name: "Казнь",        unlock: 50, cost: 40,  cooldown: 30 }
      avatar_of_war: { name: "Аватара войны", unlock: 75, cost: 100, cooldown: 300, duration: 8 }

  HUNTER:
    resource-regen: 5.0         # концентрация: +5/с вне боя, 0 в бою
    resource-on-deal: 0.0
    resource-on-take: 0.0
    resource-on-heal: 0.0
    combat-window-seconds: 5
    theme:
      primary: "#1B4D1B"
      secondary: "#3FA33F"
      symbol: "➳"
    cast-sound: ENTITY_PLAYER_LEVELUP
    cast-particle: CRIT
    abilities:
      aimed_shot:     { name: "Прицельный выстрел",   unlock: 10, cost: 20, cooldown: 15 }
      cheetah_aspect: { name: "Аспект гепарда",       unlock: 25, cost: 0,  cooldown: 60, duration-speed: 8, duration-no-fall: 10 }
      multi_shot:     { name: "Мультивыстрел",        unlock: 50, cost: 40, cooldown: 25 }
      barrage:        { name: "Заградительный огонь", unlock: 75, cost: 80, cooldown: 120 }

  PRIEST:
    resource-regen: 2.0         # свет: +2/с всегда
    resource-on-deal: 0.0
    resource-on-take: 0.0
    resource-on-heal: 5.0       # +5 за событие лечения
    combat-window-seconds: 5
    theme:
      primary: "#B8B8B8"
      secondary: "#FFF6D8"
      symbol: "✚"
    cast-sound: ENTITY_PLAYER_LEVELUP
    cast-particle: ENCHANTED_HIT
    abilities:
      lesser_heal:      { name: "Малое исцеление",   unlock: 1,  cost: 10, cooldown: 3 }
      flash_heal:       { name: "Быстрое исцеление", unlock: 10, cost: 20, cooldown: 6 }
      pw_shield:        { name: "Слово силы: Щит",   unlock: 25, cost: 30, cooldown: 30, duration: 6 }
      circle_of_prayer: { name: "Круг молитвы",      unlock: 50, cost: 50, cooldown: 60 }
      smite:            { name: "Кара",              unlock: 75, cost: 60, cooldown: 90 }

  MAGE:
    resource-regen: 2.0         # мана: +2/с
    resource-on-deal: 0.0
    resource-on-take: 0.0
    resource-on-heal: 0.0
    combat-window-seconds: 5
    theme:
      primary: "#101A6E"
      secondary: "#3F6FFF"
      symbol: "✦"
    cast-sound: ENTITY_PLAYER_LEVELUP
    cast-particle: PORTAL
    abilities:
      firebolt:     { name: "Огненная стрела",   unlock: 1,  cost: 10,  cooldown: 2 }
      blink:        { name: "Скачок",            unlock: 25, cost: 20,  cooldown: 20 }
      frost_nova:   { name: "Кольцо льда",       unlock: 50, cost: 40,  cooldown: 45, duration: 4 }
      arcane_burst: { name: "Чародейский взрыв", unlock: 75, cost: 100, cooldown: 180 }

  ROGUE:
    resource-regen: 10.0        # энергия: +10/с
    resource-on-deal: 0.0
    resource-on-take: 0.0
    resource-on-heal: 0.0
    combat-window-seconds: 5
    theme:
      primary: "#2A0A3A"
      secondary: "#8B2FBF"
      symbol: "☠"
    cast-sound: ENTITY_PLAYER_LEVELUP
    cast-particle: SOUL_FIRE_FLAME
    abilities:
      stealth:       { name: "Скрытность",  unlock: 10, cost: 30, cooldown: 30, duration: 15 }
      fan_of_knives: { name: "Веер ножей",  unlock: 25, cost: 25, cooldown: 15 }
      cheap_shot:    { name: "Подлый удар", unlock: 50, cost: 40, cooldown: 40, duration: 2 }
      evasion:       { name: "Уклонение",   unlock: 75, cost: 60, cooldown: 120, duration: 4 }
