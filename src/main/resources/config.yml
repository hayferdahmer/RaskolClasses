# ============================================================
#  RaskolClasses v1.14.4 — «РАСКОЛ | ДВЕ КОРОНЫ» [RELEASE]
#  Весь баланс, стилистика и длительности — в этом файле.
#  Per-class приоритет: plugins/RaskolClasses/kits/<class>.yml (P5).
#  Применение: ПОЛНАЯ замена файла + рестарт сервера.
#  ВАЖНО: inline-маппинги пишутся ТОЛЬКО с пробелом после двоеточия
#  («key: { a: 1 }»), иначе snakeyaml падает с «mapping values are
#  not allowed here».
#
#  1.10.x: чернокнижник, Скверна, Пентаграмма, фолиант-дроп, sorcery-прогрессия.
#  1.11.x: soulbound/релок фолианта, спек-трейты, игнор маг-резиста ≤25% HP,
#          рефакторинг P1–P5, эксплойт-фиксы S1–S5/F1–F10, selftest 48.
#  1.12.x: школы урона, митигация/пробитие/иммунитеты, стихийный резист-слой,
#          pen-трейты, DoT-ядро, HUD DoT-строка, баланс-прогон матрицы.
#  1.13.0: КОНТРОЛЬ (CC) И УБЫВАЮЩАЯ ОТДАЧА (DR): cc.*, messages.cc.*,
#          VanillaCCWrapper, голограмма TextDisplay, CastChannels, CcSanity.
#  1.14.0: «Спек 2.0» — деревья путей: spec2.*, 18 спеков, роли, DoT wither,
#          treeAbilities (древесные способности китов), selftest 94 чека.
#  1.14.0 (Б11.1.2-B2): переносимые slots 4–5 удалены из abilities;
#          авторитетный источник — treeAbilities.
#  1.14.3 (Волна 3): 3A/3B/3C1/3C2 — лечение/паверы/ресурс/проки мили и каст.
#  1.14.4 (Волна 4): П7 респец узла, П8 resist-<school>, П9 конфиг-ключи
#          spec2.start-level/max-points/row-gates, П10 spec2-storage.yml.
# ============================================================

hud:
  enabled: true
  update-period-ticks: 10
  skip-spectator: true
  full-resource-aura: true
  debug-skip: false
  boss-bar:
    enabled: true
    min-duration-seconds: 8
    max-visible: 2
    tick-period: 5
    format: "{name} — {sec}с"
    format-infinite: "{name}"

performance:
  purge-interval-ticks: 1200
  cast-click-cooldown-ms: 150
  sound-budget-per-tick: 8
  ready-notify:
    enabled: true
    min-cooldown-seconds: 30
    sound: ENTITY_PLAYER_LEVELUP
    message: "{ability} — готова"
    spec-enabled: true

hooks:
  raskolcore:
    enabled: true

hotbar-bind:
  enabled: true
  material: AMETHYST_SHARD
  cooldown-bar: true

target-cast:
  enabled: true
  debug: false

compat:
  authme-gate: true
  block-casts-in-creative: false

combat:
  friendly-fire: false
  debug-damage: false
  true-damage-cap-per-hit: 1000
  aoe-los: true
  max-single-hit-pct: 35
  cap-exempt-causes:
    - FALL
    - DROWNING
    - SUFFOCATION
    - STARVATION
    - VOID
    - SONIC_BOOM
  burst-window-seconds: 3.0
  burst-window-pct: 18.0
  dot-dps-cap-pct: 6.0

storage:
  autosave-minutes: 5

class-accept:
  enabled: true
  subtitle: "Твой путь избран"

balance:
  target-ttk-seconds: 20.0

character-level:
