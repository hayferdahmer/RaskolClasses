  start-level: 40
  points-per-level: 1
  max-points: 21
  reset-base: 500
  reset-per-point: 25

spec:
  respec-base-cost: 250
  respec-per-level: 10

# ------------------------------------------------------------
# 1.14.0 «Спек 2.0»: деревья путей.
# Очки: charLevel 15→60 = 46; стоимость ранга 1 очко в любом из 3 деревьев класса;
# гейты рядов — по очкам ВНУТРИ дерева [0,5,10,15,20,30] (ульт = ряд 6 @30).
# Ёмкость дерева 50–58 рангов > 46 → закрыть дерево математически нельзя.
# Основная спека выбирается один раз на 15 (chooseMain) и даёт роль:
#   FIGHTER +2% урона · TANK +5% ccResist и +5% получаемого лечения ·
#   HEALER +5% исходящего лечения.
# ------------------------------------------------------------
spec2:
  enabled: true
  start-level: 15
  points-per-level: 1
  max-points: 46
  row-gates: [0, 5, 10, 15, 20, 30]
  tree-capacity-min: 50
  respec-base-cost: 250
  respec-per-level: 10
  # 1.14.4 (Волна 4, П7): респец одного ранга конкретного узла.
  # Цена = node-respec-base + node-respec-per-rank × текущий_ранг_узла.
  # Эскалация: снять ранг у 5/5 дороже (400), чем у 1/5 (200).
  node-respec-base: 150
  node-respec-per-rank: 50
  respec-main-role-discount: 0.5
  role-passives:
    FIGHTER:
      damage-mult: 0.02
    TANK:
      cc-resist: 0.05
      heal-received: 0.05
    HEALER:
      heal-mult: 0.05

foliant:
  drop-enabled: true
  drop-nether-only: true
  drop-chance-percent: 0.001
  drop-mobs:
    - PIGLIN
    - PIGLIN_BRUTE
    - ZOMBIFIED_PIGLIN
  relock:
    enabled: true
    kills-outside-nether: 1
    deaths: 1
    piglin-kills-no-chance: 1000
  soulbound:
    keep-on-death: true
    prevent-drop: true
    owner-lock-pickup: true
  item-name: "§5§lФолиант Душ. Том I"
  gui-title: "§5§lФолиант Душ · Том I"
