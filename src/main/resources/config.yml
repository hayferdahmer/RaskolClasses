# ============================================================
#  RaskolClasses v1.7.0-p2 — сервер «РАСКОЛ | ДВЕ КОРОНЫ»
#  Весь баланс, стилизация и длительности — в этом файле.
#  Применение без рестарта: /rc reload (кроме hp-display.mode — рестарт).
#  Новые ключи дописываются автоматически (addDefault + copyDefaults),
#  правки админа не затираются.
#  1.6.7: ConfigValidator проверяет резист/урон-ключи на старте и reload.
#  1.6.10: атомарные сейвы хранилищ + .bak + автосейв (секция storage).
#  1.7.0: классовые атрибуты СИЛА/ЛОВКОСТЬ/ИНТЕЛЛЕКТ (секция attributes),
#         HP-реформа: строгая компоновка + градиентные полосы + искра регена.
# ============================================================

hud:
  enabled: true               # ресурсная строка HudService (только при hp-display.mode: vanilla)
  update-period-ticks: 10     # период HUD-тика (O5)
  skip-spectator: true        # не слать actionbar зрителям (O8)
  full-resource-aura: true    # партикл темы раз в 20 тиков при ресурсе 100 (§4.5)
  debug-skip: false           # лог пропусков dirty-rendering — для проверки O1
  boss-bar:
    enabled: true             # босс-бары длительных эффектов (НЕ для HP)
    min-duration-seconds: 8   # порог показа (эффекты с меньшей длительностью скрыты)
    max-visible: 2            # максимум баров одновременно (топ-N по оставшемуся времени)
    tick-period: 5            # период опроса эффектов, в тиках
    format: "{name} — {sec}с"
    format-infinite: "{name}"

performance:
  purge-interval-ticks: 1200    # чистка истёкших кулдаунов и флагов (O7)
  cast-click-cooldown-ms: 150   # анти-спам дабл-клика каста (O12)
  sound-budget-per-tick: 8      # 1.5.7: максимум sound-событий за тик на сервер
  ready-notify:
    enabled: true             # звук + actionbar при окончании КД
    min-cooldown-seconds: 30  # порог: уведомлять только о длинных КД
    sound: ENTITY_PLAYER_LEVELUP
    message: "{ability} — готова"
    spec-enabled: true        # 1.5.1: готовность спек-активки озвучивается отдельно

hooks:
  raskolcore:
    enabled: true             # читать класс из паспорта RaskolCore (LP — фолбэк)

hotbar-bind:
  enabled: true               # свитки способностей (Книга класса / свитки в хотбаре)
  material: AMETHYST_SHARD    # материал классового свитка (спец-свиток — NETHER_STAR)
  cooldown-bar: true          # 1.5.6: полоска перезарядки на свитке в хотбаре

target-cast:
  enabled: true               # ЛКМ со свитком точечной способности по игроку = каст в цель
  debug: false                # true — точки обрыва ЛКМ-каста в чат ([dbg] ...)

# 1.5.8: совместимость и края
compat:
  authme-gate: true             # неаутентифицированные (AuthMe, до /login) не пользуют свитки/касты
  block-casts-in-creative: true # способности недоступны в creative (кроме raskolclasses.admin)

# 1.6.2 + 1.6.9 + 1.6.11: справедливость боя и рубильники
combat:
  friendly-fire: false   # false = союзники не получают наш урон, хилы не ложатся на врагов;
                         # true  = старое поведение (AoE бьёт всех, хилы на кого угодно) для арен
  debug-damage: false    # 1.6.4: боевой лог нашего урона для админов (raskolclasses.debug)
  true-damage-cap-per-hit: 1000   # 1.6.9: предохранитель компоненты true за один вызов
  aoe-los: true          # 1.6.11: AoE-урон не проходит сквозь стены (стекло/камень);
                         # вода/воздух/трава не блокируют; false = старое поведение

# 1.6.10: надёжность хранения
storage:
  autosave-minutes: 5   # период автосейва cooldowns.yml + spec-choices.yml;
                        # при краше теряется не более N минут кулдаунов,
                        # спек-выборы не теряются вовсе (сейв на каждое изменение)

class-accept:
  enabled: true               # титр при первом принятии класса (раз в сессию)
  subtitle: "Твой путь избран"

# 1.4.0 / Пакет 3: платный респец (money-sink)
spec:
  respec-base-cost: 250       # базовая цена сброса спеки
  respec-per-level: 10        # +10 за каждый уровень профильного скилла

# 1.6.0: система сопротивлений урону (РЕЗИСТ)
# Эффективный резист = база класса + модификаторы (эффекты/спек-пассивки/гранты),
# суммарно не выше cap. Формула: получено = компонент × (1 − резист/100).
# Чистый урон (true) игнорирует резисты целиком.
# 1.6.7: все ключи ниже проверяет ConfigValidator (диапазоны 0..100, ≥ 0, типы).
resist:
  cap: 90                     # максимум суммарного резиста, %
  pvp-cap: 90                 # 1.6.9: отдельный кап резиста для урона от игроков (дефолт = cap)
  disabled-worlds: []         # 1.6.9: миры без резистов (арены/хабы), напр. [world_arena]
  classes:
    WARRIOR:                  # Воин: крепкий к оружию, слабее к магии
      magic: 12
      physical: 27
    ROGUE:                    # Разбойник: уклончив, без тяжёлой защиты
      magic: 12
      physical: 14
    MAGE:                     # Маг: сильная магическая защита, хрупкий телом
      magic: 26
      physical: 12
    PRIEST:                   # Жрец: лучшая магическая защита
      magic: 30
      physical: 16
    HUNTER:                   # Охотник: сбалансированный лёгкий доспех
      magic: 12
      physical: 16
  grants:                     # 1.6.6: единый источник грантов для боя И лора Книги
    steel_skin:
      physical: 15
    evasion:
      physical: 30
  mana-soaked:                # 1.6.0 пакет 3: динамический резист мага (мана ≥ порога)
    enabled: true
    physical: 15
    magic: 15
  specs:
    guardian:
      physical: 10            # пассивка спеки Страж (постоянно)

# ------------------------------------------------------------
# 1.7.0: КЛАССОВЫЕ АТРИБУТЫ (СИЛА / ЛОВКОСТЬ / ИНТЕЛЛЕКТ)
# Значение = base + growth×PlayerLevel + модификаторы (спек/эффекты).
# PlayerLevel по умолчанию = уровень профильного скилла класса.
# Вся математика — AttributeMath (pure); боевое применение — пакеты 2–4.
# ------------------------------------------------------------
attributes:
  level-source: class-skill   # class-skill | vanilla
  classes:
    WARRIOR: { main: STR, base-str: 12, base-agi: 6,  base-int: 4,  growth-str: 1.2, growth-agi: 0.5, growth-int: 0.3 }
    HUNTER:  { main: AGI, base-str: 6,  base-agi: 12, base-int: 4,  growth-str: 0.5, growth-agi: 1.2, growth-int: 0.3 }
    ROGUE:   { main: AGI, base-str: 7,  base-agi: 11, base-int: 4,  growth-str: 0.6, growth-agi: 1.1, growth-int: 0.3 }
    MAGE:    { main: INT, base-str: 4,  base-agi: 6,  base-int: 12, growth-str: 0.3, growth-agi: 0.5, growth-int: 1.2 }
    PRIEST:  { main: INT, base-str: 5,  base-agi: 5,  base-int: 12, growth-str: 0.4, growth-agi: 0.4, growth-int: 1.2 }
  hp:
    per-str: 2          # HP за единицу СИЛЫ
    per-level: 1        # HP за уровень
    main-str-bonus: 1   # дополнительный HP за СИЛУ, если СИЛА — основной атрибут
                        # (итог воина: 20 + STR×3 + level)
  offense:
    str-to-physical: true   # плоская добавка STR+level к физ-компоненте (пакет 4)
    int-to-magic: true      # плоская добавка INT+level к маг-компоненте (пакет 4)
  crit:
    melee-base: 5           # базовый крит мили, %
    melee-per-agi: 0.05     # +0.05% за единицу ЛОВКОСТИ
    melee-cap: 40           # кап крита мили, %
    melee-mult: 1.5         # множитель урона при крите мили
    spell-base: 5           # базовый крит магии, %
    spell-per-int: 0.03     # +0.03% за единицу ИНТЕЛЛЕКТА
    spell-cap: 35           # кап крита магии, %
    spell-mult: 1.5         # множитель урона при крите магии
    spell-main-mult: 1.5    # дополнительный множитель шанса, если INT основной
  avoidance:
    dodge-k: 100              # знаменатель гиперболы уклонения: 100×AGI/(AGI+k)
    parry-k: 150              # знаменатель гиперболы парирования: 100×STR/(STR+k)
    soft-cap: 60              # до него — без убывающей отдачи (DR)
    dr-factor: 0.5            # цена процента свыше soft-cap (каждый за полцены)
    hard-cap: 75              # жёсткий предел суммарного avoidance (dodge+parry)
    agi-main-parry-micro: 0.5 # микро-парирование AGI-основных классов, % (не работает в спину)
    agi-main-dodge-refund: 0.5 # доля потерянного парирования, уходящая в уклонение
    front-angle: 90           # фронт для парирования, градусов (угол взгляда ≤ 90)
    back-angle: 135           # отсюда начинается «спина» (микро-парирование не работает)
    parry-stagger-player-ms: 600  # стаггер атакующего-игрока при парировании (дебафф attack-speed)
    parry-stagger-mob-ms: 500     # стаггер моба: knockback + Slowness I
  hp-display:
    mode: actionbar           # actionbar = совмещённая строка с полосами; vanilla = старая строка HudService
    gauge: true               # сегменты ▰▱ в строке; false — только цифры
    gauge-length: 10          # число сегментов на каждую шкалу (4..20)
    hearts-scale: 20.0        # 20 = один ряд из 10 сердец на весь пул HP;
                              # 0 НЕ поддерживается ядром (Paper требует >0) — полное скрытие
                              # сердец возможно только ресурспаком (прозрачные heart-спрайты)
    update-period-ticks: 10   # тот же тик-паттерн, что у HUD
    # 1.7.0-p2.5 «строгая готика»: палитра полос (тюнинг без пересборки, /rc reload)
    colors:
      frame: "#8B5A3C"        # рамка ❬ ❭ — бронза бренда (тон ⚜ из MOTD)
      gauge-empty: "#6E5232"  # пустые сегменты ▱ — тёмная бронза (контур полосы)
      numbers: "#D6CDBE"      # цифры — тёплый светлый пергамент (контраст на тёмном)
    # 1.7.0-p2.6: градиенты заполнения полос (каждый сегмент ▰ получает свой цвет)
    gradient:
      enabled: true           # false = плоский цвет (hp-end и res-end)
      hp-start: "#5C0F0F"     # HP — тёмно-бордовый (начало, у сердца)
      hp-end: "#C82020"       # HP — насыщенный красный (конец, у цифр)
      res-start: "#8B5A3C"    # фолбэк ресурса, если у темы нет primary
      res-end: "#D6A642"      # фолбэк ресурса, если у темы нет secondary
                              # вживую: у каждого класса свой градиент theme.primary → theme.secondary
    # 1.7.0-p2.6: искра регена — последний залитый сегмент вспыхивает при росте HP/ресурса
    regen-spark:
      enabled: true           # false = без искры
      color: "#F5E6B8"        # белое золото — читается как вспышка заполнения
    format: "❤ {hp}/{max}"
  boss-no-avoidance: []       # имена MythicMobs-боссов: их атаки не уклоняются/парируются

# 1.6.0: переопределение типов ванильных причин урона (physical|magic|true).
# Дефолты кода: огонь/яды/иссушение/молния = magic; VOID/SONIC_BOOM = true;
# CRAMMING/DRYOUT = physical (явно с 1.6.8); остальное = physical.
damage-types:
  vanilla-map:
    SONIC_BOOM: 'true'
    VOID: 'true'
    FIRE: magic
    FIRE_TICK: magic
    LAVA: magic
    HOT_FLOOR: magic
    POISON: magic
    WITHER: magic
    MAGIC: magic
    DRAGON_BREATH: magic
    FREEZING: magic
    LIGHTNING: magic

