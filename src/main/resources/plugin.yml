name: RaskolClasses
version: '1.5.0'
main: dev.raskol.classes.RaskolClasses
api-version: '1.21'
author: hayferdahmer
description: Активные способности пяти классов сервера «РАСКОЛ | ДВЕ КОРОНЫ» + специализации, инсталляции и королевские вкусы

softdepend: [LuckPerms, AuraSkills, PlaceholderAPI, RaskolCore, Towny]

commands:
  rc:
    description: Команды классов RaskolClasses
    usage: /rc [1-7|menu|hud|reload|debug|bind|spec|respec]

permissions:
  raskolclasses.admin:
    description: Перезагрузка конфигурации, бесплатный респец, инсталляции без анлока
    default: op
  raskolclasses.debug:
    description: Диагностика (/rc debug [player])
    default: op
