name: RaskolClasses
version: ${project.version}
main: dev.raskol.classes.RaskolClasses
api-version: '1.21'
author: hayferdahmer
description: "Шесть классов, деревья путей и боевая система сервера «РАСКОЛ | ДВЕ КОРОНЫ»"
website: https://github.com/hayferdahmer/RaskolClasses

softdepend:
  - LuckPerms
  - AuraSkills
  - PlaceholderAPI
  - RaskolCore
  - Towny
  - Vault
  - AuthMe
  - Essentials
  - packetevents
  - PlayerPoints

commands:
  rc:
    description: "Главная команда RaskolClasses"
    usage: "/rc [menu|reload|debug|health|selftest|gear|foliant|cc|plus]"
    aliases: [raskol, raskolclasses]

permissions:
  raskolclasses.use:
    description: "Базовое использование системы классов"
    default: true
  raskolclasses.menu:
    description: "Открытие Книги класса (/rc menu)"
    default: true
  raskolclasses.debug:
    description: "Диагностика: /rc debug, /rc gear, /rc health, /rc selftest"
    default: op
  raskolclasses.admin:
    description: "Админские команды: /rc reload, /rc foliant give"
    default: op
  raskolclasses.admin.cc:
    description: "CC/DR-админка: /rc cc status|clear|test|reset|list"
    default: op
  raskolclasses.admin.item:
    description: "Просмотр реестра предметов и админский браузер"
    default: op
  raskolclasses.admin.item.give:
    description: "Выдача и тестовый ролл предметов"
    default: op
  # 1.14.15: raskolspec+
  raskolclasses.plus.use:
    description: "Использование raskolspec+ (status, apply, gift)"
    default: true
  raskolclasses.admin.plus:
    description: "Администрирование raskolspec+ (grant, revoke)"
    default: op
