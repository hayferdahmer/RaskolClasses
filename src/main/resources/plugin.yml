name: RaskolClasses
version: ${project.version}
main: dev.raskol.classes.RaskolClasses
api-version: '1.21'
author: hayferdahmer
description: >-
  Активные способности шести классов сервера «РАСКОЛ | ДВЕ КОРОНЫ»:
  специализации, таланты, инсталляции (Пентаграмма), боевая математика,
  виртуальный пул HP, хук RaskolGear, скрытый путь — Чернокнижник
  (Фолиант Душ: дроп 0.001% с пиглинов ада, чтение Магом/Жрецом 40+),
  per-class конфиги kits/*.yml. Линия 1.12: сверхстабильность (рефакторинг
  P1–P5, эксплойт-фиксы S1–S5/F1–F10, selftest 48 чеков).
website: https://github.com/hayferdahmer/RaskolClasses

softdepend:
  - LuckPerms
  - AuraSkills
  - PlaceholderAPI
  - RaskolCore
  - Towny
  - Vault
  - RaskolGear
  - AuthMe
  - Essentials
  - packetevents

commands:
  rc:
    description: "Главная команда RaskolClasses"
    usage: "/rc [menu|reload|debug|health|selftest|gear|foliant]"
    aliases: [raskol, raskolclasses]

permissions:
  raskolclasses.use:
    description: "Базовое использование системы классов"
    default: true
  raskolclasses.menu:
    description: "Открытие Книги класса (/rc menu)"
    default: true
  raskolclasses.debug:
    description: "Диагностика: /rc debug, /rc gear, /rc health, /rc selftest"
    default: op
  raskolclasses.admin:
    description: "Админские команды: /rc reload, /rc foliant give"
    default: op
