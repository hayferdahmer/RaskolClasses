name: RaskolClasses
version: '1.6.12'
main: dev.raskol.classes.RaskolClasses
api-version: '1.21'
author: hayferdahmer
description: Активные способности пяти классов сервера «РАСКОЛ | ДВЕ КОРОНЫ» + специализации, инсталляции, королевские вкусы и система урона/резистов

softdepend: [LuckPerms, AuraSkills, PlaceholderAPI, RaskolCore, Towny, AuthMe]

commands:
  rc:
    description: Команды классов RaskolClasses
    usage: /rc [1-7|menu|reload|debug|health]

permissions:
  raskolclasses.admin:
    description: Перезагрузка конфигурации, бесплатный респец, инсталляции без анлока, касты в creative
    default: op
  raskolclasses.debug:
    description: Диагностика (/rc debug [player], /rc health, боевой лог combat.debug-damage)
    default: op
