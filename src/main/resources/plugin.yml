name: RaskolClasses
version: ${project.version}
main: dev.raskol.classes.RaskolClasses
api-version: '1.21'
author: hayferdahmer
description: >-
  Активные способности шести классов сервера «РАСКОЛ | ДВЕ КОРОНЫ»:
  специализации, таланты, инсталляции (Пентаграмма), виртуальный пул HP,
  хук RaskolGear, скрытый путь — Чернокнижник
  (Фолиант Душ: дроп 0.001% с пиглинов ада, чтение Магом/Жрецом 40+),
  per-class конфиги kits/*.yml, школы урона и DoT-ядро (линия 1.12.x),
  контроль и убывающая отдача (линия 1.13.0: 9 типов CC, 6 категорий DR,
  обёртка ванильных зелий, HUD-строки, /rc cc). Selftest: 90 headless-чеков.
website: https://github.com/hayferdahmer/RaskolClasses

softdepend:
  - LuckPerms
  - AuraSkills
  - PlaceholderAPI
  - RaskolCore
  - Towny
  - Vault
  - RaskolGear
  - AuthMe
  - Essentials
  - packetevents

commands:
  rc:
    description: "Главная команда RaskolClasses"
    usage: "/rc [menu|reload|debug|health|selftest|gear|foliant|cc]"
    aliases: [raskol, raskolclasses]

permissions:
  raskolclasses.use:
    description: "Базовое использование системы классов"
    default: true
  raskolclasses.menu:
    description: "Открытие Книги класса (/rc menu)"
    default: true
  raskolclasses.debug:
    description: "Диагностика: /rc debug, /rc gear, /rc health, /rc selftest"
    default: op
  raskolclasses.admin:
    description: "Админские команды: /rc reload, /rc foliant give"
    default: op
  raskolclasses.admin.cc:
    description: "CC/DR-админка: /rc cc status|clear|test|reset|list"
    default: op
