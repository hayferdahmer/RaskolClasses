name: RaskolClasses
version: ${project.version}
main: dev.raskol.classes.RaskolClasses
api-version: '1.21'
author: hayferdahmer
description: "Шесть классов, деревья путей и боевая система сервера «РАСКОЛ | ДВЕ КОРОНЫ»"
website: https://github.com/hayferdahmer/RaskolClasses

softdepend:
  - LuckPerms
  - AuraSkills
  - PlaceholderAPI
  - RaskolCore
  - Towny
  - Vault
  - AuthMe
  - Essentials
  - packetevents
  - PlayerPoints
  - MythicMobs

commands:
  rc:
    description: "Главная команда RaskolClasses"
    usage: "/rc [menu|reload|debug|health|selftest|gear|foliant|cc|plus|item]"
    aliases: [raskol, raskolclasses]

permissions:
  raskolclasses.use:
    description: "Базовое использование системы классов"
    default: true
  raskolclasses.menu:
    description: "Открытие Книги класса (/rc menu)"
    default: true
  raskolclasses.debug:
    description: "Диагностика: /rc debug, /rc gear, /rc health, /rc selftest"
    default: op
  raskolclasses.admin:
    description: "Админские команды: /rc reload, /rc foliant give"
    default: op
  raskolclasses.admin.cc:
    description: "CC/DR-админка: /rc cc status|clear|test|reset|list"
    default: op

  # 1.14.15: raskolspec+
  raskolclasses.plus.use:
    description: "Использование raskolspec+ (status, buy, gift, apply)"
    default: true
  raskolclasses.admin.plus:
    description: "Администрирование raskolspec+ (grant, revoke, export)"
    default: op

  # 1.15.5 (аудит 2.7-2/2.7-5): дерево прав предметного слоя.
  # 1.15.5-b: дети объявлены ОДНОВРЕМЕННО топ-уровнем — Bukkit getDescription()
  # возвращает только верхнеуровневые Permission, а selftest-чек 138 и LuckPerms
  # должны видеть каждый узел явно (inline-children не попадают в список).
  raskolclasses.item:
    description: "Базовый доступ к предметному слою (stats/salvage/craft — свои)"
    default: true
    children:
      raskolclasses.item.stats: true
      raskolclasses.item.salvage: true
      raskolclasses.item.craft: true
  raskolclasses.item.stats:
    description: "Свои статы снаряжения (/rc item stats)"
    default: true
  raskolclasses.item.salvage:
    description: "Разбор своего предмета на фрагменты (/rc item salvage)"
    default: true
  raskolclasses.item.craft:
    description: "Крафт из фрагментов (/rc item craft, GUI)"
    default: true
  raskolclasses.item.admin:
    description: "Админ-доступ к предметному слою (give/reload/debug/browser)"
    default: op
    children:
      raskolclasses.item.give: true
      raskolclasses.item.reload: true
      raskolclasses.item.debug: true
      raskolclasses.item.browser: true
  raskolclasses.item.give:
    description: "Выдача предметов (/rc item give|roll)"
    default: op
  raskolclasses.item.reload:
    description: "Перезагрузка реестра предметов (/rc item reload)"
    default: op
  raskolclasses.item.debug:
    description: "UID-диагностика и stats чужих игроков"
    default: op
  raskolclasses.item.browser:
    description: "Админ-браузер предметов (/rc item browse)"
    default: op
