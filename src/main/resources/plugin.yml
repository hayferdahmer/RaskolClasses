name: RaskolClasses
version: ${project.version}
main: dev.raskol.classes.RaskolClasses
api-version: '1.21'
author: hayferdahmer
description: >-
  Активные способности шести классов сервера «РАСКОЛ | ДВЕ КОРОНЫ»:
  деревья путей «Спек 2.0» (18 специализаций, роли FIGHTER/TANK/HEALER,
  ульты ряда 6, бюджет 46 очков с 15 уровня), пет-система (волк/демон/тенескот,
  1.14.6), инсталляции (Пентаграмма), виртуальный пул HP, хук RaskolGear,
  скрытый путь — Чернокнижник (Фолиант Душ: дроп 0.001% с пиглинов ада,
  чтение Магом/Жрецом 40+), школы урона и DoT (1.12.x), контроль с убывающей
  отдачей (1.13.0), per-class конфиги kits/*.yml, респец узла и
  spec2-storage.yml (1.14.4). Selftest: 111 headless-чеков.
website: https://github.com/hayferdahmer/RaskolClasses

softdepend:
  - LuckPerms
  - AuraSkills
  - PlaceholderAPI
  - RaskolCore
  - Towny
  - Vault
  - RaskolGear
  - AuthMe
  - Essentials
  - packetevents

commands:
  rc:
    description: "Главная команда RaskolClasses"
    usage: "/rc [menu|reload|debug|health|selftest|gear|foliant|cc]"
    aliases: [raskol, raskolclasses]

permissions:
  raskolclasses.use:
    description: "Базовое использование системы классов"
    default: true
  raskolclasses.menu:
    description: "Открытие Книги класса (/rc menu)"
    default: true
  raskolclasses.debug:
    description: "Диагностика: /rc debug, /rc gear, /rc health, /rc selftest"
    default: op
  raskolclasses.admin:
    description: "Админские команды: /rc reload, /rc foliant give"
    default: op
  raskolclasses.admin.cc:
    description: "CC/DR-админка: /rc cc status|clear|test|reset|list"
    default: op
