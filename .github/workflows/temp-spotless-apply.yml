name: Temporary Spotless formatting

on:
  push:
    branches:
      - refactor/a03-foundation-lifecycle
    paths:
      - .github/workflows/temp-spotless-apply.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: refactor/a03-foundation-lifecycle
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Apply repository formatter
        run: mvn -Pdev -B spotless:apply
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: apply Spotless formatting to salvage flow"
          git push origin HEAD:refactor/a03-foundation-lifecycle
