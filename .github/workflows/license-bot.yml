# CI: авто-применение лицензионных шапок v2.0 на main (1.15.7).
#
# Как работает:
#   push в main (или ручной dispatch) → --apply → если есть изменения:
#   commit + push через PAT (секрет LICENSE_BOT_PAT).
#   Цикл исключён: скрипт идемпотентен, второй прогон не найдёт изменений.
#
# 1.15.7-fix: actions/checkout настраивает extraheader с GITHUB_TOKEN, и обычный
#   `git push` использует его вместо нашего URL с BOT_TOKEN. Сбрасываем extraheader
#   и создаём отдельный remote `bot` с URL, содержащим PAT.
#
# Предусловие: в репозитории создан secret `LICENSE_BOT_PAT`:
#   Settings → Secrets and variables → Actions → New repository secret
#   Fine-grained PAT: repo RaskolClasses, permissions:
#     Contents: Read and write
#     Workflows: Read and write ← обязательно
name: License Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: license-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-headers:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply license headers v2.0
        run: python3 tools/apply-license-header.py --apply

      - name: Self-check (идемпотентность после apply)
        run: python3 tools/apply-license-header.py --check

      - name: Commit and push if changed
        env:
          BOT_TOKEN: ${{ secrets.LICENSE_BOT_PAT }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Заголовки v2.0 уже в порядке — коммит не нужен."
            exit 0
          fi
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::secret LICENSE_BOT_PAT не задан. Создай его в Settings → Secrets → Actions (Fine-grained PAT с scopes Contents+Workflows R/W)."
            exit 1
          fi
          git config user.name "raskol-license-bot"
          git config user.email "raskol-license-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(license): auto-apply v2.0 headers"
          # 1.15.7-fix: сбрасываем extraheader от actions/checkout и пушим через отдельный remote
          git config --unset-all http.https://github.com/.extraheader || true
          git remote add bot "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git" 2>/dev/null || true
          git push bot HEAD:main
