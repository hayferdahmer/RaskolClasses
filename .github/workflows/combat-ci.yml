name: RaskolClasses Combat CI Guard

on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/config.yml'
      - 'src/main/resources/kits/**'
      - 'src/main/resources/abilities/**'
      - 'src/main/resources/spec2/**'
      - 'pom.xml'
      - 'tools/combat-ci/**'
      - '.github/workflows/combat-ci.yml'
  push:
    branches: [ '**' ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/config.yml'
      - 'src/main/resources/kits/**'
      - 'src/main/resources/abilities/**'
      - 'src/main/resources/spec2/**'
      - 'pom.xml'
      - 'tools/combat-ci/**'
      - '.github/workflows/combat-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combat-ci-guard:
    name: Combat CI Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Identify combat changes and enforce package test coverage
        id: audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/combat-ci/check_combat_diff.py

      - name: Run tests, Spotless and SpotBugs
        id: verify
        run: mvn -Pdev -B verify

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-ci-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/spotbugsXml.xml
            target/site/jacoco/**

      - name: Combat CI summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMBAT_CHANGED: ${{ steps.audit.outputs.combat_changed }}
          TESTS_CHANGED: ${{ steps.audit.outputs.tests_changed }}
          COMBAT_PACKAGES: ${{ steps.audit.outputs.combat_packages }}
        run: |
          {
            echo "## Combat CI Guard"
            echo "- Result: **${JOB_STATUS}**"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Combat changes: ${COMBAT_CHANGED:-unknown}"
            echo "- Test changes: ${TESTS_CHANGED:-unknown}"
            echo "- Combat packages: ${COMBAT_PACKAGES:-none}"
            echo "- Required gate: Java 25 Maven verify, unit tests, Spotless and SpotBugs."
            echo "- Statistical balance gate: pending versioned Combat Lab JSON baseline/report implementation."
          } >> "$GITHUB_STEP_SUMMARY"
