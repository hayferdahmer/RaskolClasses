name: RaskolClasses Spotless Format

on:
  push:
    branches: [ refactor/a03-foundation-lifecycle, feat/v1.16-core-progression ]
    paths:
      - .github/workflows/spotless-format.yml
      - docs/architecture/A03_REMAINING_LIFECYCLE_OWNERSHIP_INVENTORY.md
      - 'src/main/java/**/*.java'
      - 'src/test/java/**/*.java'
  workflow_dispatch:

permissions:
  contents: write

# Общая группа с Formatting Bot исключает параллельную запись в одну ветку.
concurrency:
  group: spotless-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/refactor/a03-foundation-lifecycle' || github.ref == 'refs/heads/feat/v1.16-core-progression'
    runs-on: ubuntu-24.04
    steps:
      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/refactor/a03-foundation-lifecycle" && "${GITHUB_REF}" != "refs/heads/feat/v1.16-core-progression" ]]; then
            echo "This workflow is restricted to the approved development branches."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply Spotless formatting
        run: mvn -Pdev -B spotless:apply

      - name: Commit and push formatting changes safely
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes were necessary."
            exit 0
          fi

          git commit -m "style: apply Spotless formatting"

          pushed=false
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "::error::Formatting changes conflict with newer commits on ${TARGET_BRANCH}; no remote changes were made."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              pushed=true
              break
            fi
            echo "Branch advanced during push; retrying against its latest head."
          done

          if [[ "${pushed}" != "true" ]]; then
            echo "::error::Could not push formatting commit after 3 attempts."
            exit 1
          fi

      - name: Verify final branch state
        run: mvn -Pdev -B verify
