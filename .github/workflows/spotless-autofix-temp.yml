name: Temporary Spotless Autofix

on:
  push:
    branches:
      - feat/v1.16-combat-lab-specialization-sets

permissions:
  contents: write

jobs:
  spotless-autofix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Warm Maven dependencies
        run: mvn -Pdev -B -DskipTests -Dspotless.check.skip=true verify
      - name: Apply Spotless
        run: mvn -Pdev -B com.diffplug.spotless:spotless-maven-plugin:3.10.4:apply
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/test/java
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(combat-lab): apply Spotless formatting"
          git push
