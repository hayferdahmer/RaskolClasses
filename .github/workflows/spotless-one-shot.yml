name: One-shot Spotless formatter for PR 52

on:
  push:
    branches: [ feat/v1.16-combat-source-context ]
    paths:
      - '.github/workflows/spotless-one-shot.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply the repository's exact Spotless formatter
        run: mvn -Pdev -B spotless:apply

      - name: Commit only the two audited files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/raskol/classes/combat/DamageSourceContext.java
          git add src/test/java/dev/raskol/classes/combat/DamageSourceContextTest.java
          if git diff --cached --quiet; then
            echo "Spotless found no changes."
            exit 0
          fi
          git commit -m "style(combat): apply Spotless formatting"
          git push origin HEAD:refs/heads/feat/v1.16-combat-source-context
