name: Temporary Spotless formatter

on:
  push:
    branches:
      - feat/v1.16-combat-lab-equipment-layer
    paths:
      - .github/workflows/spotless-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: feat/v1.16-combat-lab-equipment-layer

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply repository formatting
        run: mvn -Pdev -B spotless:apply

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/test/java
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style(combat-lab): apply Spotless formatting"
            git push origin HEAD:refs/heads/feat/v1.16-combat-lab-equipment-layer
          fi
