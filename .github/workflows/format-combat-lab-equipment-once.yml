name: One-time Combat Lab formatter

on:
  push:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/v1.16-combat-lab-equipment-layer
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply repository formatter
        run: mvn -Pdev -B spotless:apply
      - name: Commit formatted Combat Lab files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/raskol/classes/combat/lab/CombatLabEquipmentSnapshot.java src/test/java/dev/raskol/classes/combat/lab/CombatLabEquipmentSnapshotTest.java
          if ! git diff --cached --quiet; then
            git commit -m "style(combat-lab): apply repository formatting"
            git push origin HEAD:feat/v1.16-combat-lab-equipment-layer
          fi
