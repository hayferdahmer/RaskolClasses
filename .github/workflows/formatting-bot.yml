# Автоматическая нормализация Java-форматирования через Spotless.
name: RaskolClasses Formatting Bot

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Ветка или тег, который нужно отформатировать"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spotless-bot-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply Spotless and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply Spotless formatting
        run: mvn -Pdev -B spotless:apply

      - name: Validate formatted project
        run: mvn -Pdev -B verify

      - name: Create formatting pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ inputs.target_ref }}
          branch: bot/spotless-normalization
          delete-branch: false
          commit-message: "style: normalize Java formatting with Spotless"
          title: "style: normalize Java formatting"
          body: |
            ## Автоматическая нормализация форматирования

            Этот PR создан Formatting Bot.

            - Применён `mvn -Pdev -B spotless:apply`.
            - После форматирования успешно выполнен `mvn -Pdev -B verify`.
            - Изменения ограничены форматированием Java-кода и удалением неиспользуемых импортов согласно конфигурации Spotless.

            RIPS, ключи подписи, секреты GitHub, зависимости и бизнес-логика намеренно не изменяются.
          labels: |
            automated
            formatting
