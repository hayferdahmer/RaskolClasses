# Автоматическая нормализация Java-форматирования через Spotless.
name: RaskolClasses Formatting Bot

on:
  # Одноразовый запуск при изменении самого workflow в целевой ветке.
  # Коммит форматирования меняет только Java-файлы и повторно workflow не запускает.
  push:
    branches: [ platform/paper-26.2-java-25 ]
    paths:
      - .github/workflows/formatting-bot.yml
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Ветка или тег, который нужно отформатировать"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

# Та же concurrency group, что и у Spotless Format: один writer на ветку.
concurrency:
  group: spotless-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply Spotless and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Apply Spotless formatting
        run: mvn -Pdev -B spotless:apply

      - name: Check formatting diff
        run: git diff --check

      - name: Commit and push formatting changes safely
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Spotless found no changes; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/main/java/**/*.java' 'src/test/java/**/*.java'
          if git diff --cached --quiet; then
            echo "No Java formatting changes to commit."
            exit 0
          fi
          git commit -m "style: apply Spotless formatting for Java 25"

          pushed=false
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin "${TARGET_REF}"
            if ! git rebase "origin/${TARGET_REF}"; then
              git rebase --abort || true
              echo "::error::Formatting changes conflict with newer commits on ${TARGET_REF}; no remote changes were made."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/${TARGET_REF}"; then
              pushed=true
              break
            fi
            echo "Branch advanced during push; retrying against its latest head."
          done

          if [[ "${pushed}" != "true" ]]; then
            echo "::error::Could not push formatting commit after 3 attempts."
            exit 1
          fi

      - name: Verify final branch state
        run: mvn -Pdev -B verify
