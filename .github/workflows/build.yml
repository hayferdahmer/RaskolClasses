# CI: сборка + pure-тесты (JUnit 5) до публикации артефакта.
# 1.14.10 (волна 7.1, P0-11-01): `mvn -B clean package` заменён на `mvn -B verify` —
# фаза test гоняет Surefire-тесты; упавший тест блокирует артефакт.
name: RaskolClasses Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (mvn verify)
        run: mvn -B verify

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raskol-classes
          path: target/raskol-classes-*.jar
          if-no-files-found: error
          retention-days: 14
