# RaskolClasses CI: license gate + RIPS policy + build + tests + release.
#
# RIPS 3.0.6.7.2.4.4:
#   - проверка release signing policy в build job;
#   - Python policy tests;
#   - проверка соответствия CI private key единственному ACTIVE public key
#     непосредственно перед публикацией релиза;
#   - private key доступен только signing-verification/release jobs через Environment Secret.
name: RASKOL Forge | Build & Release

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # Основной job: license gate + RIPS policy tests + build.
  # -----------------------------------------------------------
  build:
    name: Build & Test (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: License headers (check)
        run: python3 tools/apply-license-header.py --check

      # RIPS 3.0.6.7.2.4.4:
      # Проверяем сам policy checker без доступа к приватному ключу.
      - name: RIPS release signing policy tests
        run: python3 -m unittest discover -s tools/rips -p 'test_*.py' -v

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test (mvn verify)
        run: mvn -B verify

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: raskol-classes
          path: target/raskol-classes-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30

  # -----------------------------------------------------------
  # Обязательный контур качества: -Xlint:all + Spotless + SpotBugs.
  # Блокирует PR, OFFICIAL signing verification и публикацию релиза.
  # -----------------------------------------------------------
  code-quality:
    name: Quality Gate (Spotless + SpotBugs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with -Pdev (lint + SpotBugs)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Maven quality gate attempt ${attempt}/3"
            mvn -Pdev -B -DskipTests verify 2>&1 | tee /tmp/maven-quality.log
            status=${PIPESTATUS[0]}
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP Status: 429|status 429|Too Many Requests' /tmp/maven-quality.log; then
              exit "${status}"
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Maven Central rate limit persisted after 3 attempts."
              exit "${status}"
            fi
            sleep $((attempt * 20))
          done

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary (findings count)
        if: always()
        run: |
          if [ -f target/spotbugsXml.xml ]; then
            COUNT=$(grep -o '<BugInstance' target/spotbugsXml.xml | wc -l | tr -d ' ')
            echo "### SpotBugs findings (после exclude-фильтра): $COUNT" >> $GITHUB_STEP_SUMMARY
            if [ "$COUNT" -gt 0 ]; then
              echo "⚠ Новые находки сверх исключённых паттернов — скачать артефакт spotbugs-report и триажить." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### SpotBugs: отчёт не сгенерирован" >> $GITHUB_STEP_SUMMARY
          fi


  # -----------------------------------------------------------
  # Real Paper 26.2 runtime smoke test with the freshly built plugin.
  # Uses an explicitly authorized DEVELOPMENT artifact; never a release key.
  # -----------------------------------------------------------
  paper-runtime-qa:
    name: RASKOL Watchtower | Paper 26.2 Runtime
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download plugin artifact
        uses: actions/download-artifact@v5
        with:
          name: raskol-classes
          path: artifacts

      - name: Resolve and verify stable Paper 26.2 build
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://fill.papermc.io/v3/projects/paper/versions/26.2/builds"
          curl -fsSL \
            -H "User-Agent: RASKOL-CI/1.0 (https://github.com/hayferdahmer/RaskolClasses)" \
            "$API_URL" -o paper-builds.json
          DOWNLOAD_URL="$(jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' paper-builds.json)"
          EXPECTED_SHA256="$(jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].checksums.sha256)' paper-builds.json)"
          curl -fL --retry 3 --retry-all-errors "$DOWNLOAD_URL" -o paper.jar
          echo "$EXPECTED_SHA256  paper.jar" | sha256sum --check

      - name: Install plugin and prepare isolated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/plugins
          cp artifacts/raskol-classes-*.jar runtime/plugins/RaskolClasses.jar
          printf 'eula=true\n' > runtime/eula.txt
          cat > runtime/server.properties <<'PROPERTIES'
          online-mode=false
          server-port=25575
          max-players=1
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          enable-rcon=false
          enable-query=false
          PROPERTIES
          cp paper.jar runtime/paper.jar

      - name: Start Paper and verify plugin enablement
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          java -Xms512M -Xmx1G -Draskol.rips.development=true -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill -TERM "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 150); do
            if grep -Fq "Done (" server.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "::error::Paper exited before startup completed."
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            cat server.log
            echo "::error::Paper did not finish startup within 5 minutes."
            exit 1
          fi
          if ! grep -Eq 'Enabled RaskolClasses v' server.log; then
            cat server.log
            echo "::error::RaskolClasses did not complete plugin enablement on Paper."
            exit 1
          fi
          echo "Paper 26.2 startup and RaskolClasses plugin enablement: PASS"
          grep -E 'Preparing level|Enabling RaskolClasses|Done \(' server.log

      - name: Upload Paper runtime log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: paper-26.2-runtime-log
          path: runtime/server.log
          if-no-files-found: ignore
          retention-days: 14

  # -----------------------------------------------------------
  # Manual OFFICIAL signing verification.
  #
  # This job is intentionally limited to workflow_dispatch on main.
  # The version is read from pom.xml. It creates a signed JAR artifact
  # for server validation, but NEVER creates a tag or publishes a Release.
  # -----------------------------------------------------------
  signing-verification:
    name: RIPS Official Signing Check
    needs: [build, code-quality, paper-runtime-qa]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: rips-release
    permissions:
      contents: read
    steps:
      - name: Checkout main source
        uses: actions/checkout@v5

      - name: Enforce RIPS release signing policy
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
        run: python3 tools/rips/verify-release-signing-policy.py

      - name: Download verified build artifact
        uses: actions/download-artifact@v5
        with:
          name: raskol-classes
          path: release-artifacts

      - name: Read project version
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=namespace)
          if version is None or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("pom.xml must declare a stable SemVer release version")
          print(version)
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create OFFICIAL RIPS artifact (no publication)
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="release-artifacts/raskol-classes-${VERSION}.jar"
          test -f "$JAR"
          python3 tools/rips/create-official-artifact.py \
            --jar "$JAR" \
            --version "$VERSION" \
            --build-id "manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$GITHUB_SHA" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXPECTED_VERSION="$VERSION" python3 - "$JAR" <<'PY'
          import base64
          import hashlib
          import os
          import sys
          import zipfile

          jar = sys.argv[1]
          expected_version = os.environ["EXPECTED_VERSION"]
          with zipfile.ZipFile(jar) as archive:
              identity = archive.read("META-INF/raskol/build.properties").decode("utf-8")
              required = (
                  "product.id=RaskolClasses",
                  f"plugin.version={expected_version}",
                  "build.type=OFFICIAL",
              )
              if not all(item in identity.splitlines() for item in required):
                  raise SystemExit("OFFICIAL build identity validation failed")
              signature = base64.b64decode(
                  archive.read("META-INF/raskol/integrity/manifest.sig").strip(),
                  validate=True,
              )
              if len(signature) != 64:
                  raise SystemExit("Invalid Ed25519 signature length")
              if archive.testzip() is not None:
                  raise SystemExit("JAR ZIP integrity validation failed")
          with open(jar, "rb") as stream:
              print("OFFICIAL artifact SHA-256:", hashlib.sha256(stream.read()).hexdigest())
          print("OFFICIAL build identity and archive checks: PASS")
          PY

      - name: Upload signed verification artifact
        uses: actions/upload-artifact@v5
        with:
          name: raskol-classes-${{ steps.release_metadata.outputs.version }}-official-verification
          path: release-artifacts/raskol-classes-${{ steps.release_metadata.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 7

      - name: Verification summary
        if: success()
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          echo "### RIPS OFFICIAL signing verification: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed artifact uploaded separately; no GitHub Release was published." >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------
  # Release job.
  #
  # RIPS 3.0.6.7.2.4.4:
  #   Environment rips-release предоставляет signing private key.
  #   До публикации проверяется:
  #     1. ровно один ACTIVE key;
  #     2. отсутствие дубликатов;
  #     3. корректность Ed25519 public keys;
  #     4. соответствие CI private key активному public key.
  # -----------------------------------------------------------
  release:
    name: Signed Release Publication
    needs: [build, code-quality, paper-runtime-qa]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: rips-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce RIPS release signing policy
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
        run: python3 tools/rips/verify-release-signing-policy.py

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: raskol-classes
          path: release-artifacts

      - name: Create official RIPS artifact
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          JAR="release-artifacts/raskol-classes-${GITHUB_REF_NAME#v}.jar"
          python3 tools/rips/create-official-artifact.py \
            --jar "$JAR" \
            --version "${GITHUB_REF_NAME#v}" \
            --build-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$GITHUB_SHA" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; print; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION (see CHANGELOG.md)" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: false
