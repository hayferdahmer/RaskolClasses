# RaskolClasses CI: license gate + RIPS policy + build + tests + release.
#
# RIPS 3.0.6.7.2.4.4:
#   - проверка release signing policy в build job;
#   - Python policy tests;
#   - проверка соответствия CI private key единственному ACTIVE public key
#     непосредственно перед публикацией релиза;
#   - private key доступен только release job через Environment Secret.
name: RaskolClasses Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # Основной job: license gate + RIPS policy tests + build.
  # -----------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: License headers (check)
        run: python3 tools/apply-license-header.py --check

      # RIPS 3.0.6.7.2.4.4:
      # Проверяем сам policy checker без доступа к приватному ключу.
      - name: RIPS release signing policy tests
        run: python3 -m unittest discover -s tools/rips -p 'test_*.py' -v

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test (mvn verify)
        run: mvn -B verify

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: raskol-classes
          path: target/raskol-classes-*.jar
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------
  # Расширенный анализ: -Xlint:all + SpotBugs.
  # На обычных ветках и PR остаётся диагностическим.
  # Для tag-релизов и ручной OFFICIAL signing verification — обязательный gate.
  # -----------------------------------------------------------
  analyze:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/1.15.8') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with -Pdev (lint + SpotBugs)
        run: mvn -Pdev -B verify

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary (findings count)
        if: always()
        run: |
          if [ -f target/spotbugsXml.xml ]; then
            COUNT=$(grep -o '<BugInstance' target/spotbugsXml.xml | wc -l | tr -d ' ')
            echo "### SpotBugs findings (после exclude-фильтра): $COUNT" >> $GITHUB_STEP_SUMMARY
            if [ "$COUNT" -gt 0 ]; then
              echo "⚠ Новые находки сверх исключённых паттернов — скачать артефакт spotbugs-report и триажить." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### SpotBugs: отчёт не сгенерирован" >> $GITHUB_STEP_SUMMARY
          fi

  # -----------------------------------------------------------
  # Manual OFFICIAL signing verification.
  #
  # This job is intentionally limited to workflow_dispatch on
  # release/1.15.8. It creates a signed JAR artifact for server
  # validation, but NEVER creates a tag or publishes a GitHub Release.
  # -----------------------------------------------------------
  signing-verification:
    needs: [build, analyze]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/1.15.8'
    runs-on: ubuntu-24.04
    environment:
      name: rips-release
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Enforce RIPS release signing policy
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
        run: python3 tools/rips/verify-release-signing-policy.py

      - name: Download verified build artifact
        uses: actions/download-artifact@v5
        with:
          name: raskol-classes
          path: release-artifacts

      - name: Create OFFICIAL RIPS artifact (no publication)
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="release-artifacts/raskol-classes-1.15.8.jar"
          test -f "$JAR"
          python3 tools/rips/create-official-artifact.py \
            --jar "$JAR" \
            --version "1.15.8" \
            --build-id "manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$GITHUB_SHA" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$JAR" <<'PY'
          import base64
          import hashlib
          import sys
          import zipfile

          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as archive:
              identity = archive.read("META-INF/raskol/build.properties").decode("utf-8")
              required = (
                  "product.id=RaskolClasses",
                  "plugin.version=1.15.8",
                  "build.type=OFFICIAL",
              )
              if not all(item in identity.splitlines() for item in required):
                  raise SystemExit("OFFICIAL build identity validation failed")
              signature = base64.b64decode(
                  archive.read("META-INF/raskol/integrity/manifest.sig").strip(),
                  validate=True,
              )
              if len(signature) != 64:
                  raise SystemExit("Invalid Ed25519 signature length")
              if archive.testzip() is not None:
                  raise SystemExit("JAR ZIP integrity validation failed")
          with open(jar, "rb") as stream:
              print("OFFICIAL artifact SHA-256:", hashlib.sha256(stream.read()).hexdigest())
          print("OFFICIAL build identity and archive checks: PASS")
          PY

      - name: Upload signed verification artifact
        uses: actions/upload-artifact@v5
        with:
          name: raskol-classes-1.15.8-official-verification
          path: release-artifacts/raskol-classes-1.15.8.jar
          if-no-files-found: error
          retention-days: 7

      - name: Verification summary
        if: success()
        run: |
          echo "### RIPS OFFICIAL signing verification: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: release/1.15.8" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 1.15.8" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed artifact uploaded separately; no GitHub Release was published." >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------
  # Release job.
  #
  # RIPS 3.0.6.7.2.4.4:
  #   Environment rips-release предоставляет signing private key.
  #   До публикации проверяется:
  #     1. ровно один ACTIVE key;
  #     2. отсутствие дубликатов;
  #     3. корректность Ed25519 public keys;
  #     4. соответствие CI private key активному public key.
  # -----------------------------------------------------------
  release:
    needs: [build, analyze]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: rips-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce RIPS release signing policy
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
        run: python3 tools/rips/verify-release-signing-policy.py

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: raskol-classes
          path: release-artifacts

      - name: Create official RIPS artifact
        env:
          RIPS_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RIPS_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          JAR="release-artifacts/raskol-classes-${GITHUB_REF_NAME#v}.jar"
          python3 tools/rips/create-official-artifact.py \
            --jar "$JAR" \
            --version "${GITHUB_REF_NAME#v}" \
            --build-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$GITHUB_SHA" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; print; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION (see CHANGELOG.md)" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: false
