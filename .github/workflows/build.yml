# CI: сборка + pure-тесты (JUnit 5) до публикации артефакта.
# 1.14.10 (волна 7.1, P0-11-01): `mvn -B clean package` заменён на `mvn -B verify` —
# фаза test гоняет Surefire-тесты; упавший тест блокирует артефакт.
# 1.14.13 (Sprint 9, Волна 13A, P0-15-01/02):
#   - analyze-job: `mvn -Pdev verify` параллельно build — расширенная компиляция
#     (-Xlint:all) + SpotBugs; не блокирует build (continue-on-error);
#   - release-job: по тегу v* скачивает артефакт build-job и публикует GitHub Release
#     с jar + changelog-секцией из CHANGELOG.md.
# 1.14.13-fix: триггер push возвращён на ВСЕ ветки ('**') — рабочая ветка разработки
#   raskolclasses-plugin-development-* иначе выпадала из CI (раны не создавались).
name: RaskolClasses Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # Основной job: обязательный гейт — зелёные unit-тесты + jar
  # -----------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (mvn verify)
        run: mvn -B verify

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raskol-classes
          path: target/raskol-classes-*.jar
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------
  # 1.14.13 (13A): расширенный анализ — -Xlint:all + SpotBugs.
  # Не блокирует build (continue-on-error), отчёт публикуется как артефакт.
  # Локально: mvn -Pdev -B verify
  # -----------------------------------------------------------
  analyze:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with -Pdev (lint + SpotBugs)
        run: mvn -Pdev -B verify

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary (warning count)
        if: always()
        run: |
          if [ -f target/spotbugsXml.xml ]; then
            COUNT=$(grep -c '<BugInstance' target/spotbugsXml.xml || echo 0)
            echo "### SpotBugs findings: $COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "### SpotBugs: отчёт не сгенерирован" >> $GITHUB_STEP_SUMMARY
          fi

  # -----------------------------------------------------------
  # 1.14.13 (13A): публикация GitHub Release по тегу v*.
  # Скачивает артефакт build-job и прикрепляет к релизу.
  # Локально: git tag v1.14.13 && git push origin v1.14.13
  # -----------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: raskol-classes
          path: release-artifacts

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          # Выдёргиваем секцию текущей версии из CHANGELOG.md между заголовками
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; print; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION (see CHANGELOG.md)" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: false
