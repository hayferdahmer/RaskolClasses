name: Temporary Combat Lab Formatter

on:
  push:
    branches:
      - feat/v1.16-combat-lab-headless-runner
    paths:
      - .github/workflows/format-combat-lab-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v1.16-combat-lab-headless-runner
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply repository formatter
        run: mvn -Pdev -B spotless:apply
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/raskol/classes/combat/lab/ src/test/java/dev/raskol/classes/combat/lab/
          git commit -m "style(combat-lab): apply repository Spotless formatting"
          git push origin HEAD:feat/v1.16-combat-lab-headless-runner
