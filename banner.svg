<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e0e0"/>
      <stop offset="0.35" stop-color="#9a9a9a"/>
      <stop offset="0.7" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#232323"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b45a"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
    <radialGradient id="candle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#c47a2a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
    </filter>
    <filter id="mist"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1000" height="360" fill="#0b0a08"/>
  <rect width="1000" height="360" filter="url(#grain)" opacity="0.05"/>

  <!-- свет свечи над залой -->
  <ellipse cx="500" cy="60" rx="460" ry="120" fill="url(#candle)">
    <animate attributeName="opacity" values="0.85;0.55;0.9;0.4;0.8;0.65;0.85" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- туман земель по низу -->
  <ellipse cx="260" cy="330" rx="340" ry="46" fill="#232326" opacity="0.35" filter="url(#mist)">
    <animateTransform attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="34s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="336" rx="320" ry="42" fill="#241d1a" opacity="0.30" filter="url(#mist)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="41s" repeatCount="indefinite"/>
  </ellipse>

  <!-- гербовая двойная рамка -->
  <rect x="14" y="14" width="972" height="332" fill="none" stroke="#35322d" stroke-width="1"/>
  <rect x="22" y="22" width="956" height="316" fill="none" stroke="#6b5a2e" stroke-width="1" opacity="0.7"/>
  <polygon points="22,16 28,22 22,28 16,22" fill="#8a6a2a"/>
  <polygon points="978,16 984,22 978,28 972,22" fill="#8a6a2a"/>
  <polygon points="22,332 28,338 22,344 16,338" fill="#8a6a2a"/>
  <polygon points="978,332 984,338 978,344 972,338" fill="#8a6a2a"/>
  <!-- корона над рамкой -->
  <g transform="translate(488,6) scale(0.95)" fill="url(#gold)">
    <path d="M0,12 L4,3 L8,9 L12,0 L16,9 L20,3 L24,12 Z M0,13 h24 v3 h-24 z"/>
  </g>

  <!-- ИМЯ: ровно по центру полотна (x=500 + textLength; оптический центр капители y=180).
       УДАЛЕНО: мечи, кровавая черта, ромб, боковые короны, имена фракций. -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="80" letter-spacing="6"
     text-anchor="middle" font-weight="bold">
    <text x="500" y="211" fill="#000000" opacity="0.8"
          textLength="820" lengthAdjust="spacingAndGlyphs">RASKOL CLASSES</text>
    <text x="500" y="205" fill="#cfcfcf" opacity="0.30"
          textLength="820" lengthAdjust="spacingAndGlyphs">RASKOL CLASSES</text>
    <text x="500" y="208" fill="url(#iron)" stroke="#520000" stroke-width="1.2"
          textLength="820" lengthAdjust="spacingAndGlyphs">RASKOL CLASSES</text>
  </g>

  <!-- угли костра -->
  <circle cx="180" cy="340" r="1.6" fill="#ff9a3c" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;14 -250" dur="7s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.5;0" keyTimes="0;0.15;0.6;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="340" r="1.2" fill="#ff6b35" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;-10 -270" dur="9s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.4;0" keyTimes="0;0.15;0.6;1" dur="9s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="340" r="2" fill="#d8b45a" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;6 -240" dur="6.5s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.5;0" keyTimes="0;0.15;0.6;1" dur="6.5s" begin="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="340" r="1.4" fill="#ff9a3c" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;12 -260" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.45;0" keyTimes="0;0.15;0.6;1" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="340" r="1.8" fill="#ff6b35" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 -250" dur="7.5s" begin="3.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.5;0" keyTimes="0;0.15;0.6;1" dur="7.5s" begin="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="340" r="1.1" fill="#d8b45a" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;10 -280" dur="10s" begin="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.4;0" keyTimes="0;0.15;0.6;1" dur="10s" begin="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="340" r="1.3" fill="#ff9a3c" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;-12 -270" dur="9.5s" begin="6.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.4;0" keyTimes="0;0.15;0.6;1" dur="9.5s" begin="6.8s" repeatCount="indefinite"/>
  </circle>

  <rect width="1000" height="360" fill="url(#vig)"/>
</svg>
