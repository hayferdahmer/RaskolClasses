<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.6"/>
      <rect y="2" width="4" height="2" fill="#0a0a0a" opacity="0.35"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.92"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8ff9e" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#7aa030" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#520000"/>
      <stop offset="0.5" stop-color="#8b0000"/>
      <stop offset="1" stop-color="#520000"/>
    </linearGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e0000"/>
      <stop offset="1" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="spikeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ccff00" stop-opacity="0"/>
      <stop offset="1" stop-color="#ccff00" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="spikeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ccff00" stop-opacity="0"/>
      <stop offset="1" stop-color="#ccff00" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch">
        <animate attributeName="seed" values="3;11;23;37;51;67" dur="0.5s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55" intercept="0"/></feComponentTransfer>
    </filter>
    <filter id="fog"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ccff00" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#8b0000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="tearA"><rect x="0" y="138" width="1000" height="12"/></clipPath>
    <clipPath id="tearB"><rect x="0" y="166" width="1000" height="7"/></clipPath>
  </defs>

  <rect width="1000" height="340" fill="#020202"/>

  <!-- туман в нижних углах -->
  <ellipse cx="280" cy="308" rx="360" ry="62" fill="#223022" opacity="0.05" filter="url(#fog)">
    <animateTransform attributeName="transform" type="translate" values="0 0;60 0;0 0" dur="30s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="740" cy="322" rx="330" ry="54" fill="#302222" opacity="0.05" filter="url(#fog)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-70 0;0 0" dur="37s" repeatCount="indefinite"/>
  </ellipse>

  <!-- умирающая люминесцентная лампа -->
  <ellipse cx="500" cy="30" rx="430" ry="95" fill="url(#lamp)">
    <animate attributeName="opacity" values="0.9;0.12;0.7;0.06;0.85;0.2;0.55;0.9" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>

  <rect width="1000" height="340" fill="url(#scan)"/>

  <!-- подтёки крови сверху -->
  <rect x="212" y="0" width="2.5" height="0" fill="url(#drip)">
    <animate attributeName="height" values="0;84;84" keyTimes="0;0.55;1" dur="8s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="556" y="0" width="2" height="0" fill="url(#drip)">
    <animate attributeName="height" values="0;58;58" keyTimes="0;0.5;1" dur="11s" begin="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="842" y="0" width="3" height="0" fill="url(#drip)">
    <animate attributeName="height" values="0;96;96" keyTimes="0;0.6;1" dur="9.5s" begin="6s" repeatCount="indefinite"/>
  </rect>

  <!-- бегущие hex-потоки -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" opacity="0.10" fill="#ccff00">
    <text x="-320" y="42">0x52 0x41 0x53 0x4B 0x4F 0x4C :: 0x43 0x4C 0x41 0x53 0x53 :: 0xDE 0xAD 0xBE 0xEF
      <animateTransform attributeName="transform" type="translate" values="0 0;1340 0" dur="18s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" opacity="0.08" fill="#ff003c">
    <text x="1020" y="312">:: 0x00 0xFF 0x41 :: 0xFF 0x00 0x3C :: 0x02 0x02 0x02 :: 0xCC 0xFF 0x00 ::
      <animateTransform attributeName="transform" type="translate" values="0 0;-1360 0" dur="26s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- шёпот: hex-столбцы ползут снизу вверх по краям -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#ccff00" opacity="0.07">
    <g>
      <text x="880" y="330">0x66 0x65 0x61 0x72</text>
      <text x="880" y="310">0x6E 0x6F 0x74 0x20</text>
      <text x="880" y="290">0x66 0x6F 0x75 0x6E</text>
      <text x="880" y="270">0x64 0x00 0x66 0x65</text>
      <text x="880" y="250">0x61 0x72 0x00 0x6E</text>
      <text x="880" y="230">0x6F 0x74 0x20 0x66</text>
      <animateTransform attributeName="transform" type="translate" values="0 40;0 -380" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#ff003c" opacity="0.05">
    <g>
      <text x="96" y="336">0x68 0x65 0x6C 0x70</text>
      <text x="96" y="316">0x00 0x68 0x65 0x6C</text>
      <text x="96" y="296">0x70 0x00 0x68 0x65</text>
      <text x="96" y="276">0x6C 0x70 0x00 0x00</text>
      <text x="96" y="256">0x68 0x65 0x6C 0x70</text>
      <animateTransform attributeName="transform" type="translate" values="0 40;0 -380" dur="21s" begin="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- СИЛУЭТ: стоит в зерне, появляется на долю секунды -->
  <g fill="#0c0c0c" stroke="#260000" stroke-opacity="0.35" filter="url(#soft)" opacity="0">
    <circle cx="780" cy="118" r="13"/>
    <path d="M766,132 Q780,126 794,132 L798,196 Q780,204 762,196 Z"/>
    <rect x="770" y="196" width="8" height="62"/>
    <rect x="782" y="196" width="8" height="62"/>
    <animate attributeName="opacity" values="0;0;0.55;0.55;0" keyTimes="0;0.86;0.9;0.96;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- угловые скобки-прицелы -->
  <g stroke="#ccff00" stroke-width="3" fill="none">
    <path d="M18,64 L18,18 L64,18"/>
    <path d="M936,18 L982,18 L982,64"/>
    <path d="M18,276 L18,322 L64,322"/>
    <path d="M936,322 L982,322 L982,276"/>
    <animate attributeName="opacity" values="1;1;0.35;1;1;0.6;1" dur="4.6s" repeatCount="indefinite"/>
  </g>

  <!-- кислотные шипы -->
  <polygon points="60,150 250,144 250,156" fill="url(#spikeL)"/>
  <polygon points="940,150 750,144 750,156" fill="url(#spikeR)"/>

  <!-- глитч-заголовок с рваным сдвигом и блэкаутом -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-7 0;5 0;0 0" keyTimes="0;0.68;0.7;0.74;1" dur="5.2s" repeatCount="indefinite"/>
    <g transform="translate(500,150) skewX(-8) scale(1,1.5)"
       font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif"
       font-size="86" letter-spacing="16" text-anchor="middle">
      <text x="-4" y="0" fill="#ff003c" opacity="0.75">RASKOL CLASSES
        <animate attributeName="x" values="-4;3;-6;-4" dur="0.8s" repeatCount="indefinite"/>
      </text>
      <text x="4" y="0" fill="#00fff2" opacity="0.5">RASKOL CLASSES
        <animate attributeName="x" values="4;-3;6;4" dur="1.1s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="0" fill="#ececec" filter="url(#glow)">RASKOL CLASSES
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.42;0.44;0.5;0.52;1" dur="6.5s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- VHS-разрывы -->
  <g clip-path="url(#tearA)">
    <g transform="translate(500,150) skewX(-8) scale(1,1.5)"
       font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif"
       font-size="86" letter-spacing="16" text-anchor="middle">
      <text x="0" y="0" fill="#ccff00" opacity="0.85">RASKOL CLASSES
        <animate attributeName="x" values="0;22;-16;0" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
    </g>
  </g>
  <g clip-path="url(#tearB)">
    <g transform="translate(500,150) skewX(-8) scale(1,1.5)"
       font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif"
       font-size="86" letter-spacing="16" text-anchor="middle">
      <text x="0" y="0" fill="#ffffff" opacity="0.8">RASKOL CLASSES
        <animate attributeName="x" values="0;-26;14;0" dur="1.3s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
    </g>
  </g>

  <!-- кровавая линия: двойной удар пульса -->
  <rect x="300" y="212" width="400" height="3" fill="url(#blood)">
    <animate attributeName="opacity" values="1;0.35;1;0.7;1" keyTimes="0;0.12;0.24;0.36;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- терминальная строка -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#00ff41">
    <text x="500" y="268" text-anchor="middle">root@raskol:~# ./classes --init --force</text>
    <rect x="676" y="253" width="9" height="18" fill="#00ff41">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ползущая CRT-полоса -->
  <rect x="0" y="-70" width="1000" height="70" fill="#ffffff" opacity="0.035">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 410" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- статик-вспышки -->
  <rect x="120" y="88" width="180" height="3" fill="#e8ffe8" opacity="0">
    <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.46;0.5;0.54;1" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="640" y="204" width="240" height="2" fill="#ffe8e8" opacity="0">
    <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.62;0.66;0.7;1" dur="4.3s" begin="1.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="300" y="296" width="140" height="2" fill="#f4ffe0" opacity="0">
    <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.3;0.34;0.38;1" dur="5.2s" begin="2.9s" repeatCount="indefinite"/>
  </rect>

  <!-- ВСПЫШКА КАМЕРЫ: раз в ~9 c кадр выбеливает -->
  <rect width="1000" height="340" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.26;0;0" keyTimes="0;0.62;0.64;0.68;1" dur="9.3s" begin="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- зерно плёнки плотнее -->
  <rect width="1000" height="340" filter="url(#grain)" opacity="0.14"/>

  <rect width="1000" height="340" fill="url(#vig)"/>
</svg>
