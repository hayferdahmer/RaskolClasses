<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e0e0"/>
      <stop offset="0.35" stop-color="#9a9a9a"/>
      <stop offset="0.7" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#232323"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b45a"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
    <linearGradient id="bloodline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#520000"/>
      <stop offset="0.5" stop-color="#8b0000"/>
      <stop offset="1" stop-color="#520000"/>
    </linearGradient>
    <radialGradient id="candle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#c47a2a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
    </filter>
    <filter id="mist"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="shieldClip">
      <path d="M435,165 L565,165 L565,245 Q565,300 500,330 Q435,300 435,245 Z"/>
    </clipPath>
  </defs>

  <rect width="1000" height="400" fill="#0b0a08"/>
  <rect width="1000" height="400" filter="url(#grain)" opacity="0.05"/>

  <!-- свет свечи над залой -->
  <ellipse cx="500" cy="50" rx="460" ry="110" fill="url(#candle)">
    <animate attributeName="opacity" values="0.85;0.55;0.9;0.4;0.8;0.65;0.85" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- туман земель по низу -->
  <ellipse cx="260" cy="372" rx="340" ry="46" fill="#232326" opacity="0.35" filter="url(#mist)">
    <animateTransform attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="34s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="378" rx="320" ry="42" fill="#241d1a" opacity="0.30" filter="url(#mist)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="41s" repeatCount="indefinite"/>
  </ellipse>

  <!-- гербовая двойная рамка -->
  <rect x="14" y="14" width="972" height="372" fill="none" stroke="#35322d" stroke-width="1"/>
  <rect x="22" y="22" width="956" height="356" fill="none" stroke="#6b5a2e" stroke-width="1" opacity="0.7"/>
  <polygon points="22,16 28,22 22,28 16,22" fill="#8a6a2a"/>
  <polygon points="978,16 984,22 978,28 972,22" fill="#8a6a2a"/>
  <polygon points="22,372 28,378 22,384 16,378" fill="#8a6a2a"/>
  <polygon points="978,372 984,378 978,384 972,378" fill="#8a6a2a"/>
  <!-- корона над рамкой -->
  <g transform="translate(488,6) scale(0.95)" fill="url(#gold)">
    <path d="M0,12 L4,3 L8,9 L12,0 L16,9 L20,3 L24,12 Z M0,13 h24 v3 h-24 z"/>
  </g>

  <!-- мечи, скрещённые ЗА щитом -->
  <g stroke="#6e6a66" opacity="0.22" stroke-linecap="round">
    <line x1="360" y1="320" x2="640" y2="160" stroke-width="4"/>
    <line x1="640" y1="320" x2="360" y2="160" stroke-width="4"/>
    <line x1="372" y1="296" x2="396" y2="320" stroke-width="3"/>
    <line x1="628" y1="296" x2="604" y2="320" stroke-width="3"/>
    <circle cx="356" cy="326" r="4" fill="#6e6a66" stroke="none"/>
    <circle cx="644" cy="326" r="4" fill="#6e6a66" stroke="none"/>
  </g>

  <!-- ГЕРБ: четверование + сердцевой щиток жреца -->
  <g>
    <!-- поля (цвета = classes.*.theme.primary из config.yml) -->
    <g clip-path="url(#shieldClip)">
      <rect x="435" y="165" width="65" height="80" fill="#8B0000"/>
      <rect x="500" y="165" width="65" height="80" fill="#1B4D1B"/>
      <rect x="435" y="245" width="65" height="90" fill="#101A6E"/>
      <rect x="500" y="245" width="65" height="90" fill="#2A0A3A"/>
      <!-- рассечения: золото корон -->
      <line x1="500" y1="165" x2="500" y2="330" stroke="#d8b45a" stroke-width="2"/>
      <line x1="435" y1="245" x2="565" y2="245" stroke="#d8b45a" stroke-width="2"/>

      <!-- знак I: меч (Воин) -->
      <g stroke="#e0e0e0" stroke-width="2.5" fill="none" opacity="0.9">
        <line x1="467" y1="188" x2="467" y2="220"/>
        <line x1="459" y1="198" x2="475" y2="198"/>
      </g>
      <circle cx="467" cy="224" r="2.2" fill="#e0e0e0" opacity="0.9"/>

      <!-- знак II: стрела (Охотник) -->
      <g stroke="#cfe0cf" stroke-width="2" fill="none" opacity="0.9">
        <line x1="521" y1="217" x2="545" y2="193"/>
        <line x1="545" y1="193" x2="537" y2="195"/>
        <line x1="545" y1="193" x2="543" y2="201"/>
        <line x1="521" y1="217" x2="524" y2="211"/>
        <line x1="521" y1="217" x2="527" y2="214"/>
      </g>

      <!-- знак III: звезда (Маг) -->
      <polygon points="467,262 471,271 480,275 471,279 467,288 463,279 454,275 463,271"
               fill="#cfd8ff" opacity="0.9"/>

      <!-- знак IV: кинжал остриём вниз (Разбойник) -->
      <g stroke="#d8c8e0" stroke-width="2.5" fill="none" opacity="0.9">
        <line x1="533" y1="264" x2="533" y2="286"/>
        <line x1="526" y1="264" x2="540" y2="264"/>
      </g>
      <circle cx="533" cy="259" r="2.2" fill="#d8c8e0" opacity="0.9"/>
    </g>

    <!-- сердцевой щиток: Жрец (серебро + багряный крест) -->
    <path d="M478,222 L522,222 L522,252 Q522,272 500,282 Q478,272 478,252 Z"
          fill="#b8b8b8" stroke="url(#gold)" stroke-width="2"/>
    <rect x="496.5" y="232" width="7" height="42" fill="#8b0000"/>
    <rect x="486" y="244" width="28" height="7" fill="#8b0000"/>

    <!-- контур щита: тень + золото, медленный «дых» -->
    <path d="M435,165 L565,165 L565,245 Q565,300 500,330 Q435,300 435,245 Z"
          fill="none" stroke="#000000" stroke-width="6" opacity="0.55"/>
    <path d="M435,165 L565,165 L565,245 Q565,300 500,330 Q435,300 435,245 Z"
          fill="none" stroke="url(#gold)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- имя: выкованная капитель над щитом -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="74" letter-spacing="6"
     text-anchor="middle" font-weight="bold">
    <text x="500" y="112" fill="#000000" opacity="0.8"
          textLength="760" lengthAdjust="spacingAndGlyphs">RASKOL CLASSES</text>
    <text x="500" y="106" fill="#cfcfcf" opacity="0.30"
          textLength="760" lengthAdjust="spacingAndGlyphs">RASKOL CLASSES</text>
    <text x="500" y="109" fill="url(#iron)" stroke="#520000" stroke-width="1.2"
          textLength="760" lengthAdjust="spacingAndGlyphs">RASKOL CLASSES</text>
  </g>

  <!-- кровавая черта раскола -->
  <rect x="320" y="132" width="360" height="2" fill="url(#bloodline)"/>
  <polygon points="500,128 506,133 500,138 494,133" fill="#8b0000"/>

  <!-- две короны под щитом -->
  <g transform="translate(286,344) scale(1.1)" fill="url(#gold)">
    <path d="M0,12 L4,3 L8,9 L12,0 L16,9 L20,3 L24,12 Z M0,13 h24 v3 h-24 z"/>
  </g>
  <text x="324" y="362" font-family="Georgia, serif" font-size="19" letter-spacing="6" fill="#d8b45a">РАССВЕТ</text>
  <polygon points="500,352 506,358 500,364 494,358" fill="#6b5a2e"/>
  <text x="676" y="362" text-anchor="end" font-family="Georgia, serif" font-size="19" letter-spacing="6" fill="#b03030">ВАЛЬРАДИС</text>
  <g transform="translate(690,344) scale(1.1)" fill="#b03030">
    <path d="M0,12 L4,3 L8,9 L12,0 L16,9 L20,3 L24,12 Z M0,13 h24 v3 h-24 z"/>
  </g>

  <!-- угли костра -->
  <circle cx="180" cy="384" r="1.6" fill="#ff9a3c" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;14 -270" dur="7s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.5;0" keyTimes="0;0.15;0.6;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="384" r="1.2" fill="#ff6b35" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;-10 -290" dur="9s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.4;0" keyTimes="0;0.15;0.6;1" dur="9s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="384" r="2" fill="#d8b45a" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;6 -260" dur="6.5s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.5;0" keyTimes="0;0.15;0.6;1" dur="6.5s" begin="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="384" r="1.4" fill="#ff9a3c" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;12 -280" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.45;0" keyTimes="0;0.15;0.6;1" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="384" r="1.8" fill="#ff6b35" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 -270" dur="7.5s" begin="3.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.5;0" keyTimes="0;0.15;0.6;1" dur="7.5s" begin="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="384" r="1.1" fill="#d8b45a" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;10 -300" dur="10s" begin="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.4;0" keyTimes="0;0.15;0.6;1" dur="10s" begin="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="384" r="1.3" fill="#ff9a3c" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 0;-12 -290" dur="9.5s" begin="6.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.4;0" keyTimes="0;0.15;0.6;1" dur="9.5s" begin="6.8s" repeatCount="indefinite"/>
  </circle>

  <rect width="1000" height="400" fill="url(#vig)"/>
</svg>
